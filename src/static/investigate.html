<!DOCTYPE html>
<!--
  Open Omniscience — the /investigate dashboard (0.0.8 WP9 / RM-20).
  Copyright (C) 2026 Ideotion. GPL-3.0-or-later.

  A dedicated, card-adjusted investigation view that a Home recipe card opens in
  a NEW browser tab. Second page alongside the Console: same loopback server,
  same corpus, deliberately dependency-free (no CDN, no framework, no web fonts).

  Contract (docs/product/RELEASE_0.0.8_PLAN.md WP9):
  - the whole state lives in the URL (?view=<recipe>&<params>) — shareable,
    re-openable, no hidden state;
  - every panel is a read-only view over an EXISTING tested API;
  - the suggestions strip offers only actions the user could do manually in the
    main UI, with their parameters visible — never an automated conclusion;
  - the parent card's caveat is carried verbatim at the top.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investigate — Open Omniscience</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#ffffff; --panel2:#eef0f3; --fg:#1c2127; --fg-soft:#5c6670;
    --border:#d8dde3; --accent:#2563eb; --warn:#b45309; --err:#b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#11151a; --panel:#1a2028; --panel2:#232b35; --fg:#e6e9ed;
            --fg-soft:#9aa4ae; --border:#2e3742; --accent:#5b8def; --warn:#d97706; --err:#ef4444; }
  }
  /* The Console's chosen theme wins over the OS preference (set from oo.ui). */
  html[data-mode="dark"] { --bg:#11151a; --panel:#1a2028; --panel2:#232b35; --fg:#e6e9ed;
            --fg-soft:#9aa4ae; --border:#2e3742; --accent:#5b8def; --warn:#d97706; --err:#ef4444;
            color-scheme:dark; }
  html[data-mode="light"] { --bg:#f6f7f9; --panel:#ffffff; --panel2:#eef0f3; --fg:#1c2127;
            --fg-soft:#5c6670; --border:#d8dde3; --accent:#2563eb; --warn:#b45309; --err:#b91c1c;
            color-scheme:light; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:14px 22px; border-bottom:1px solid var(--border); background:var(--panel);
           display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; }
  header .crumb { color:var(--fg-soft); font-size:13px; }
  main { max-width:1100px; margin:0 auto; padding:18px 22px 60px; }
  .caveat { border:1px solid var(--warn); border-radius:10px; padding:10px 14px; margin:14px 0;
            background:color-mix(in srgb, var(--warn) 8%, var(--panel)); font-size:14px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px;
           padding:16px 18px; margin:14px 0; }
  .panel h2 { margin:0 0 8px; font-size:15px; }
  .panel .src { color:var(--fg-soft); font-size:12px; margin-top:8px; }
  .muted { color:var(--fg-soft); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  a { color:var(--accent); }
  .suggest { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .suggest a { display:inline-block; border:1px solid var(--border); border-radius:8px;
               padding:7px 12px; text-decoration:none; background:var(--panel2); color:var(--fg);
               font-size:13px; }
  .suggest a:hover { border-color:var(--accent); }
  .suggest .what { display:block; color:var(--fg-soft); font-size:11px; }
  .num { font-size:26px; font-weight:700; }
  .err { color:var(--err); }
</style>
</head>
<body>
<header>
  <h1 id="ttl">Investigation</h1>
  <span class="crumb">Open Omniscience · opened from a Home Lead · <a href="/" target="_blank" rel="noopener">main app ↗</a></span>
</header>
<main id="main"><p class="muted">Loading…</p></main>

<script src="/static/investigate.js"></script>
<script src="/static/i18n.js"></script>
</body>
</html>
