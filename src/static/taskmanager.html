<!DOCTYPE html>
<!--
  Open Omniscience — the standalone Task Manager (maintainer 2026-06-18, redesigned).
  Copyright (C) 2026 Ideotion. GPL-3.0-or-later.

  The maintainer's vision (anchored in the classic Windows Task Manager): see what
  consumes resources, see WHAT IS ACTUALLY HAPPENING (is an LLM translating? are
  keywords being extracted?), pause services, read performance + hardware metrics —
  plus the project's own addition: the live list of scraping / crawling / downloading
  jobs, with the ability to interact and prioritise.

  Opens in its OWN browser tab (top-bar #tm-open) so it can stay parked on the desktop.
  A read+control view over EXISTING tested endpoints — no shadow state, no framework,
  no CDN:
    * GET /api/jobs                 — every live job: collection pass (+phase), wiki/OSM
                                       downloads (+queue), the fetch on the wire, AND
                                       background LLM/analysis tasks (src.monitoring.tasks)
    * GET /api/jobs/history         — recent completed passes (the History tab)
    * GET /api/scheduler/activity   — schedule facts, current-pass progress, the plan,
                                       and `online` (airplane mode)
    * GET /api/system/vitals        — this process's CPU / memory / disk I/O / scraping ↓
  Controls POST the same endpoints the in-app window used (cancel / resume / reorder).
  Honest by construction: real states only, no fabricated "healthy", no countdown the
  backend didn't give us, no invented percentage. Reuses app.css + i18n.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task manager · FOOS</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/i18n.js"></script>
<style>
  body { margin: 0; background: var(--bg, #0d0f12); color: var(--fg, #e7e9ee);
         font: 14px/1.5 system-ui, sans-serif; }
  /* Persistent resource summary strip — always visible, optimises the header space.
     It sticks at the TOP of the viewport, and the tab row sticks right under its MEASURED
     height (--tm-sum-h, kept by a ResizeObserver below). The old constants, 43px and 86px,
     described a sticky .tm-head this page no longer has: the header is now the app's
     header.topbar, which scrolls away, so scrolled content showed through a 43px band above
     the strip, and at 375px the strip wraps to two rows (64px) and the tabs covered its
     bottom 21px (click-through, batch B12). */
  .tm-summary { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap;
                padding: 8px 16px; border-bottom: 1px solid var(--line, #232733);
                background: var(--panel2, #161a21); position: sticky; top: 0; z-index: 2; }
  .tm-state { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
  .tm-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted, #888); }
  .tm-state.on   .tm-dot { background: var(--ok, #2ecc71); box-shadow: 0 0 6px var(--ok, #2ecc71); }
  .tm-state.off  .tm-dot { background: var(--err, #e05555); box-shadow: 0 0 6px var(--err, #e05555); }
  .tm-state.idle .tm-dot { background: var(--warn, #d9a441); }
  .tm-metric { display: inline-flex; align-items: baseline; gap: 5px; font-size: 12px; }
  .tm-metric b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .tm-metric .ml { opacity: .6; text-transform: uppercase; letter-spacing: .04em; font-size: 10px; }
  /* The row scrolls INSIDE its own box rather than widening the page: five unwrapped
     tabs are ~500 px, which gave the whole page 144 px of sideways scroll at 375 px
     (2026-09-26 click-through T6). One row, not a wrap; its offset is the summary's
     measured height, since the summary is the strip that wraps. */
  .tm-tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line, #232733);
             background: var(--panel, #14171d); position: sticky; top: var(--tm-sum-h, 37px); z-index: 1;
             overflow-x: auto; }
  .tm-tabs button { flex: none; background: transparent; border: 0; color: var(--fg, #e7e9ee); opacity: .6;
                    padding: 8px 14px; border-bottom: 2px solid transparent; cursor: pointer;
                    font: inherit; border-radius: 6px 6px 0 0; }
  .tm-tabs button.active { opacity: 1; border-bottom-color: var(--accent, #4a9eff); font-weight: 600; }
  .tm-tabs button:hover { opacity: 1; background: var(--hover, rgba(255,255,255,.04)); }
  .tm-body { padding: 14px 18px; max-width: 980px; }
  .tm-panel[hidden] { display: none; }
  .vsect { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
           opacity: .7; margin: 16px 0 6px; display: flex; align-items: center; gap: 8px; }
  .vsect:first-child { margin-top: 2px; }
  .vsect .count { opacity: .5; font-weight: 500; }
  .vr { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0;
        border-bottom: 1px solid var(--line, #1c2029); font-size: 13px; }
  .vr span { opacity: .8; } .vr b { text-align: end; font-weight: 500; }
  .vnote { font-size: 11px; opacity: .6; margin: 4px 0 2px; }
  .cap-bar { position: relative; height: 14px; background: var(--line, #232733); border-radius: 7px;
             overflow: hidden; margin: 4px 0; }
  .cap-bar > i, .cap-fill { display: block; height: 100%; background: var(--accent, #4a9eff); }
  .cap-txt { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 14px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px;
          background: var(--line, #232733); }
  .pill.ok { background: var(--ok, #1f7a3f); color: #fff; }
  .pill.warn { background: var(--warn, #8a6d1a); color: #fff; }
  .pill.err { background: var(--err, #a33); color: #fff; }
  .pill.muted { opacity: .6; }
  .job { display: flex; align-items: center; gap: 8px; padding: 6px 0; flex-wrap: wrap;
         border-bottom: 1px solid var(--line, #1c2029); }
  .job .label { font-size: 13px; font-weight: 600; }
  .job .detail { font-size: 11px; opacity: .6; flex-basis: 100%; }
  .job .acts { margin-inline-start: auto; display: flex; gap: 4px; }
  .tbtn { font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 6px; cursor: pointer;
          border: 1px solid var(--line, #2a2f3a); background: var(--panel2, #1b1f27); color: var(--fg, #e7e9ee); }
  .tbtn.danger { border-color: var(--err, #a33); color: var(--err, #d66); }
  /* a11y-tm-muted-by-opacity (measured 2026-09-09 on the live page, axe-core
     serious, n=2 — #tm-conn and #jobs-body > .muted): this page dimmed secondary
     text with OPACITY rather than a colour, so the composited foreground landed at
     rgb(90,97,109) on rgb(15,18,24) = 2.99:1 against the 4.5:1 AA floor. The SPA's
     own app.css has always used a real colour for `.muted`; this page diverged.
     `var(--muted)` composites to 6.09:1 on this page's panel and, unlike an opacity
     chain, cannot be dimmed a second time by an ancestor. */
  .muted { color: var(--muted, #8c95a6); } .err-line { color: var(--err, #d66); }
  /* Performance cards: a metric + a live sparkline (built from a rolling buffer). */
  .perf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .perf-card { border: 1px solid var(--line, #232733); border-radius: 10px; padding: 10px 12px;
               background: var(--panel2, #161a21); }
  .perf-card .pt { font-size: 12px; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
  .perf-card .pv { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0 4px; }
  .perf-card .ps { font-size: 11px; opacity: .6; }
  .perf-card svg { width: 100%; height: 46px; display: block; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0; }
  .tm-upnext { margin: 4px 0 2px; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 2px; }
  .tm-upnext li { font-size: 13px; line-height: 1.5; }
  #tm-foot { padding: 10px 18px; font-size: 11px; opacity: .55; border-top: 1px solid var(--line, #232733); }
/* The language menu's row hover (was an inline onmouseover/onmouseout pair; Q1127). */
#lang-menu [role="menuitem"]:hover, #lang-menu [role="menuitem"]:focus-visible { background: var(--line); }
</style>
</head>
<body>
  <!-- Status bar: IDENTICAL to the main app's top bar (maintainer 2026-06-20) — the
       SAME header.topbar markup + app.css classes (omni search, health + LLM pills,
       airplane, language flag menu, help). No hamburger (no sidebar here) and no
       task-manager button (this IS the task manager). Omni + help route into the app;
       going ONLINE still routes to the app, where the ONE consent popup lives. -->
  <header class="topbar">
    <div class="omni" id="tm-omni" role="button" tabindex="0"
         title="Search everything — articles, dates, locations, settings, etc."
         aria-label="Search everything — articles, dates, locations, settings, etc.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </div>
    <div class="status-cluster" id="tm-status">
      <span id="health" title="Backend status"><span class="dot"></span> checking…</span>
      <span id="llm" class="pill" title="AI status">AI</span>
      <span class="muted" id="tm-conn" data-i18n>Live</span>
    </div>
    <button class="icon-btn" id="net-toggle" type="button" data-i18n-dyn
      title="Airplane mode — filled means offline: every new network request is refused instantly."
      aria-label="Airplane mode (network on/off)">
      <svg id="net-plane" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></button>
    <button class="icon-btn" id="lang-switch" type="button" title="Change language"
            aria-label="Change language" aria-haspopup="menu" style="min-width:64px;gap:5px">
      <span id="lang-flag" aria-hidden="true">🌐</span><span id="lang-code" style="font-size:12px;letter-spacing:.4px"></span>
    </button>
    <a class="icon-btn" id="tm-help" href="/#help" title="Help &amp; documentation" aria-label="Help and documentation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.3 2.4c-.8.3-1.3 1-1.3 1.8v.3"/><path d="M12 17h.01"/></svg></a>
  </header>
  <div id="lang-menu" role="menu" hidden
       style="position:fixed;z-index:300;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-height:70vh;overflow:auto"></div>
  <!-- AI-install egress window banner, the same one the app shows. This page is
       where an operator watches a long install, so the exposure must be visible
       here too rather than only in the app's chrome. Same .egress-bar rule in the
       shared app.css; populated by paintEgress() below. -->
  <div id="egress-window-bar" class="egress-bar" hidden role="status" aria-live="polite"></div>
  <!-- a11y-tm-landmarks (measured 2026-09-09 on the live page): axe-core reported
       landmark-one-main (1), page-has-heading-one (1) and region (4 — #tm-summary,
       #tm-tabs, #p-processes, #tm-foot), all moderate. Everything below the header
       sat in no landmark at all, so a screen-reader user had no way to jump to the
       page's content and no heading to orient by. #tm-tabs was flagged despite being
       a <nav> because its explicit role="tablist" REPLACES the implicit navigation
       role, so it stopped being a landmark the moment it became a tablist.
       The <h1> is .sr-only (app.css:161) because the visible identity is the title
       bar + the browser tab; it reuses the EXISTING "Task manager" key, present in
       all 12 locales, so no string is added and the i18n gate is untouched. -->
  <main>
  <h1 class="sr-only" data-i18n>Task manager</h1>
  <!-- Always-visible resource summary (state + CPU/RAM/↓/jobs) -->
  <div class="tm-summary" id="tm-summary"></div>
  <nav class="tm-tabs" id="tm-tabs" role="tablist">
    <button class="active" data-panel="processes" role="tab" data-i18n>Processes</button>
    <button data-panel="performance" role="tab" data-i18n>Performance</button>
    <button data-panel="queue" role="tab" data-i18n>Queue</button>
    <button data-panel="schedule" role="tab" data-i18n>Schedule</button>
    <button data-panel="history" role="tab" data-i18n>Sessions</button>
  </nav>
  <div class="tm-body">
    <div class="tm-panel" id="p-processes"><div id="jobs-body"></div></div>
    <div class="tm-panel" id="p-performance" hidden><div id="vitals-body"></div></div>
    <div class="tm-panel" id="p-queue" hidden><div id="queue-body"></div></div>
    <div class="tm-panel" id="p-schedule" hidden><div id="sched-body"></div></div>
    <div class="tm-panel" id="p-history" hidden><div id="hist-body"></div></div>
  </div>
  </main>
  <footer id="tm-foot" data-i18n>This window updates on its own. Collection runs continuously while online; airplane mode stops it.</footer>

<script src="/static/taskmanager.js"></script>
</body>
</html>
