# Open-Omniscience — single source of truth for packaging & tooling.
#
# Target: Qubes OS Debian AppVM · Python 3.13 · single local user · loopback-only.
# This replaces the six conflicting requirements files. Core is a lean, trustworthy
# spine (web + DB + ethical ingest + search + export); everything heavier is an
# opt-in extra. No torch/onnx/transformers/tensorflow — local LLM is the external
# Ollama binary, reached over HTTP via httpx.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-omniscience"
version = "0.3.0"
description = "Local-first, ethical intelligence platform for investigative journalists."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13"
authors = [{ name = "Ideotion", email = "open-omniscience@ideotion.com" }]
keywords = ["intelligence", "journalism", "scraping", "llm", "osint", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Linguistic",
]

# --- Core: the trustworthy spine. Lean enough to run on a modest AppVM. ---
dependencies = [
    # Web / API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    # jinja2 REMOVED 2026-09-08 (audit 10, P2-14, same shape as the structlog removal
    # below): declared since before the ledger's records with ZERO call sites -- no
    # `import jinja2`, no Jinja2Templates (the FastAPI integration one would expect
    # for HTML templating) anywhere in the tree. tests/test_dependency_hygiene.py
    # holds both halves and is written to be superseded if it is ever genuinely
    # adopted.
    "slowapi>=0.1.9",
    "prometheus-client>=0.20",
    # Data / ORM
    # No upper cap: the 2026-09-24 cap below 2.1 (2.1.0 tightened its ORM row typing
    # and the blocking mypy lane reported 19 new errors) was lifted once those were
    # fixed. The code type-checks on both 2.0.x (the lock) and 2.1.
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    # At-rest encryption (maintainer-ruled default): SQLCipher 4 via self-
    # contained wheels on Linux/Windows/macOS (verified: gate zero + the 3-OS
    # CI smoke job). Plaintext stores still open via stdlib sqlite3 -- the
    # driver engages only for encrypted files (src/database/connect.py).
    "sqlcipher3>=0.6.2",
    # Ingestion
    "requests>=2.31",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "feedparser>=6.0.11",
    "trafilatura>=1.12",          # robust article extraction (title/body/date/lang)
    # Config / validation
    "pydantic>=2.7",
    # pydantic-settings REMOVED 2026-09-08 (audit 10, P2-14): ZERO call sites --
    # no `import pydantic_settings`, no BaseSettings subclass anywhere; this app's
    # real settings pattern is hand-rolled dataclasses/dicts per module (e.g.
    # src/scheduler/settings.py). Same shape as structlog below.
    "pyyaml>=6.0.1",
    # Security (real implementations; the code must fail loudly if these are
    # absent rather than silently degrading -- see src/utils/security.py).
    "bleach>=6.1",
    "bcrypt>=4.1",
    # Untrusted-XML hardening: Wikipedia dumps are parsed as untrusted input
    # (billion-laughs / XXE defense). Used by src/wiki/dumpread.py.
    "defusedxml>=0.7.1",
    # Tamper-evident reporting (Ed25519 signatures + Merkle) is a core value
    # proposition of this tool, so its crypto lib ships in the core.
    # Floor >=50.0.0 (bumped 2026-09-08, transversal audit 10, PYSEC-2026-3552):
    # 49.0.0 (the exact version requirements.lock had pinned) carries a timing/
    # length side-channel in the PKCS7 decryption functions, fixed in 50.0.0.
    # This app's own code never calls the PKCS7 path (grep-verified), but a
    # floor-based install must not be able to resolve to the vulnerable range.
    "cryptography>=50.0.0",
    # Image metadata / EXIF verification (honest extraction, no forensics claims).
    # Floor >=12.3.0 (bumped 2026-07-25, transversal audit 09): 12.2.0 carried real
    # PYSEC-2026-* advisories reachable via POST /api/verify/image-metadata's
    # Image.open()+.load() on fully untrusted upload bytes (a journalist-facing
    # "analyze this suspicious image" endpoint -- exactly the threat model these
    # target); fixed in 12.3.0.
    "pillow>=12.3.0",
    # Utilities
    # structlog REMOVED 2026-09-07 (J2, ruled on the recommended default "drop"): it
    # was a CORE dependency with ZERO call sites -- every install downloaded it and
    # nothing imported it, while the codebase logs through stdlib `logging` at ~612
    # sites. PARKED.md's MAINT-04 entry had it as the migration TARGET for the
    # remaining print() calls, which is how an orphan survives: it reads as a plan
    # rather than as an omission. Same shape as the nltk removal below.
    # tests/test_dependency_hygiene.py holds both halves (not declared, not imported)
    # and is written to be superseded if it is ever genuinely adopted.
    "python-dateutil>=2.9",
    # tenacity / cachetools / orjson REMOVED 2026-09-08 (audit 10, P2-14): three more
    # ZERO-call-site core deps, verified by direct grep against the whole tree (not
    # just src/) -- no import of any of the three anywhere. Same shape as structlog
    # and the jinja2/pydantic-settings removals above; tests/test_dependency_hygiene.py
    # holds the guard for all six and is written to be superseded if any is ever
    # genuinely adopted.
    "psutil>=5.9",
    # Offline lemmatization (pure-Python, bundled dictionaries, NO torch, NO network).
    # MOVED here from [analysis] on 2026-09-17 by Q416 = a: lemmatisation is no longer a
    # display-time nicety over rows the store already wrote, it decides what EXTRACTION
    # writes -- so a core install that silently skipped it would build a differently
    # partitioned keyword index from a [analysis] install of the same release, and the
    # two corpora would disagree about what "the same keyword" is. Q1015 = a permits it
    # in core precisely because it is pure Python; registered in
    # configs/external_artifacts.yml (simplemma-dictionaries) as Q1015 also requires.
    "simplemma>=1.1",
    # PDF text extraction. MOVED here from the [pdf] extra on 2026-09-18 by ruling L6
    # (2026-09-15 register round, "Promote [pdf] into the default"), which overrode the
    # round's own recommended default of "leave it optional". The measurement behind it
    # is Q922 = a: 63 of the 275 law catalogue sources are PDF-ONLY, so a core install
    # could not read a fifth of the world's official gazettes at all -- and it did not
    # fail, it recorded "no usable text" and carried on, which is the honest degrade
    # doing its job over a gap nobody chose. pypdf is pure Python, BSD, no native build
    # and no network, so it costs a core install nothing but its own bytes (Q1015's bar).
    #
    # WHAT DID NOT MOVE, DELIBERATELY: the [ocr] extra. OCR needs the `tesseract` SYSTEM
    # binary, which pip cannot install, and its output is a LOWER-TRUST class this
    # project tags as such -- a scanned PDF is still honestly "no usable text" on a core
    # install, and that is a different and smaller gap than the one L6 closes.
    "pypdf>=4.0",
]

[project.optional-dependencies]
# Local LLM analysis. Ollama is an external native binary; the app speaks HTTP only.
# httpx is already in core, so this extra exists mainly to document the capability
# boundary and to pin a slightly newer floor if needed later.
llm = [
    "httpx>=0.27",
]

# Quantitative analysis / NLP (Pillar 2 rigor, keyword & link analysis). All ship
# 3.13 wheels. Kept out of core so the spine stays light.
analysis = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    # networkx MOVED to [dev] 2026-09-08 (audit 10, P2-14): it IS imported, but only
    # by scripts/analysis/phase4_analyzer.py (inside a try/except ImportError degrade)
    # and referenced by tests/conftest.py's generic optional-extra skip list -- never
    # by any runtime code under src/. install.sh's default end-user install pulls in
    # [analysis] (see OO_COMPONENTS), so leaving it here shipped a maintainer-script-only
    # package to every default install; [dev] already installs alongside [analysis] in
    # every CI lane that needs it (and alone in the core-only lane), so this is a
    # footprint fix with no behaviour change.
    # nltk REMOVED 2026-07-02: it was never imported anywhere (vaderSentiment
    # bundles its own lexicon) and PYSEC-2026-597 landed against it with no fixed
    # release -- dropping the unused dependency beats ignoring the advisory.
    "vaderSentiment>=3.3.2",
    # Offline language detection (pure-Python, bundled model, NO network) for the
    # "secondary/deduced" language of articles the source/extractor left untagged --
    # so a foreign article gets the right stoplist instead of leaking function words
    # (field §2.6). Gated like VADER: a core install simply leaves the language NULL.
    "py3langid>=0.3",
]

# Optional real Named-Entity Recognition for the Insights tab (people / orgs /
# places). Local, CPU-friendly, offline once a model is downloaded. The baseline
# extractor works without this; when present, get_extractor("spacy") uses it.
# After install, fetch a model, e.g.:  python -m spacy download en_core_web_sm
nlp = [
    "spacy>=3.7",
]

# PDF text extraction. PROMOTED INTO CORE 2026-09-18 (ruling L6) — see the note beside
# `pypdf` in `dependencies` above for why. This extra is KEPT and now resolves to the
# same requirement, so `pip install -e ".[pdf]"` in a script, a CI lane, a README or an
# operator's shell keeps working instead of failing on an unknown extra. It is not a
# second source of truth: the floor is stated once in core, and this entry references
# the capability rather than re-pinning it, because two floors for one package is how
# they come to disagree.
#
# The mis-extraction guard is unchanged and still load-bearing: a scanned/image or
# mis-decoded PDF is NEVER stored as a garbage body even when pypdf IS present, and
# `src/ingest/pdf.py` still degrades loudly rather than fabricating a body.
pdf = [
    "pypdf>=4.0",
]

# Optional OCR fallback for SCANNED / image-only PDFs (no text layer). The
# born-digital text layer ([pdf]) is always tried first — this only runs on scans.
# pytesseract (Apache-2.0) shells out to the **tesseract** SYSTEM binary, which is
# NOT pip-installable (install it separately: e.g. `apt install tesseract-ocr`, and
# `tesseract-ocr-<lang>` for extra languages); pypdfium2 (Apache-2.0/BSD, bundled
# binary, no system dep) renders pages to images; Pillow handles the image. A core
# install (or a machine without the tesseract binary) simply skips OCR — a scanned
# PDF is recorded honestly as "no usable text", never a crash. HONESTY: OCR is a
# LOWER-TRUST class (can mis-read / mis-order columns), tagged as such and gated by
# a confidence floor — the original PDF stays the source of truth.
ocr = [
    "pytesseract>=0.3.10",
    "pypdfium2>=4",
    "Pillow>=12.3.0",  # matches the core floor (see above) -- redundant but never stale
]

# Optional word segmentation for the space-less scripts (zh/ja/th) the whitespace
# tokenizer cannot split — without it a whole Chinese/Japanese sentence became ONE
# junk "keyword" and Thai shattered at its marks (field test 2026-07-08). All three
# are pure-local, OFFLINE (dictionaries bundled in the wheel, no model download, no
# network) and license-clean: jieba (MIT) / janome (Apache-2.0) / pythainlp (Apache-2.0).
# A core install works without them — src/analytics/segmentation.py degrades to the
# whitespace tokenizer and zh/ja/th stay honestly reported "unsegmented".
segmentation = [
    "jieba>=0.42",
    "janome>=0.5",
    "pythainlp>=5.0",
]

# The `crypto` extra (its only member was python-gnupg) was REMOVED 2026-09-08
# (audit 10, P2-14): ZERO references anywhere in the tree, including in
# src/custody/signing.py (this project's real, live signing implementation --
# Ed25519 + optional PQC ML-DSA, never GPG). src/crypto/signatures.py's GPGSigner
# class is an explicit, admitted stub whose methods raise NotImplementedError and
# direct callers to the real Ed25519 path; it never called into python-gnupg or any
# GPG library, so nothing regresses -- GPGSigner itself is untouched by this
# removal (a separate, complementary cleanup covers that dead-code question).
# No install.sh component, README, USER_MANUAL, CONTRIBUTING or CI job named the
# `crypto` extra (checked before deleting it), and it was never in requirements.lock
# (the lock is generated with --extra analysis only).

# Optional derived COLUMNAR read-model (data-architecture Slice 4): a DuckDB
# accelerator for the heavy whole-corpus aggregations. Kept OUT of core: when absent
# the read-model seam (src/analytics/readmodel.py) serves the live SQLite query
# (slower, never wrong). The canonical encrypted SQLCipher store always stays the
# source of truth; the columnar store is a disposable, rebuildable cache. Encryption
# uses DuckDB's AES backend (>=1.4); a SECURE persisted store needs an OpenSSL crypto
# extension available OFFLINE -- when it is not, the engine runs IN-MEMORY rather than
# ever writing a plaintext derived file (see src/analytics/columnar.py).
columnar = [
    "duckdb>=1.4",
]

# Post-quantum chain-of-custody signatures. The custody log signs with Ed25519
# alone if this is absent (and labels itself honestly); installing this upgrades
# new signatures to hybrid Ed25519 + ML-DSA (FIPS 204) for quantum resistance.
pqc = [
    # Upper-bounded on purpose, and RE-NARROWED TWICE — after #996 (2026-09-03) and again
    # after #1012 (2026-09-07) each widened it to <2.0. THE COMMENT YOU ARE READING DID NOT
    # STOP EITHER OF THEM, so the ceiling is now enforced by tests/test_dependency_ceilings.py,
    # which fails on the PR that widens it. Do not widen this to green that test. With no
    # upper bound the resolver takes 1.0.0 (2026-08-15), which breaks src/custody/signing.py
    # in TWO ways. Both measured against the real wheels, not read off a changelog:
    #   * ``generate_keypair`` was renamed ``keygen``, so signing.py:246 raises
    #     AttributeError. The module still IMPORTS, so PQC_AVAILABLE is True and the
    #     honest-degrade path never fires — it crashes instead of declining.
    #   * ``verify`` changed contract: 0.4.0 returns True/False, 1.0.0 returns None for a
    #     VALID signature and raises InvalidSignatureError for an invalid one. So
    #     signing.py:318's ``bool(_mldsa.verify(...))`` reports every valid ML-DSA
    #     signature as a verification FAILURE on any install whose keys already exist
    #     (that path never reaches generate_keypair) — a silently inverted predicate in
    #     the tamper-evidence path, which is worse than the loud AttributeError.
    # Measured with this repo's own suite: 1.0.0 → 16 failed / 23 passed across
    # test_custody_signing + test_annotations + test_custody_settings + test_crypto_erase;
    # 0.4.0 → 39 passed. Keys are plain bytes and PUBLIC_KEY_SIZE is 1952 in BOTH versions,
    # so the migration is a call-site + return-contract change rather than a key-format one
    # — but it still touches PERSISTED key material in the custody chain, so it goes through
    # docs/maintenance/EXTERNAL_DEPENDENCIES.md rather than a bound widening. Same
    # unpinned-tool drift class as the bandit/mypy pins.
    # TWO MECHANISMS DEFEND THIS CEILING, because this comment is not one of them (a bot
    # widened it three times while the reason sat right here): tests/test_dependency_
    # ceilings.py reddens the PR that widens it, and .github/dependabot.yml ignores
    # pqcrypto MAJORS so the PR is not opened at all. The test is the load-bearing half.
    "pqcrypto>=0.3.4,<1.0",
]

# Independent "existed no later than T" timestamping via OpenTimestamps (anchors
# an opaque hash into Bitcoin; no wallet, no fee). Without it, custody entries use
# a self-asserted local time and anchoring falls back to the offline local book.
timestamping = [
    "opentimestamps>=0.4.5",
]

# Optional compression accelerators for the on-disk content store. When absent the
# DB content/JSON columns fall back to stdlib zlib automatically (honest: nothing
# breaks, the ratio is just lower) -- see src/utils/compression.py. Installing
# zstandard markedly improves text compression (it is the store's preferred codec
# when available); lz4 favours speed. Both ship 3.13 wheels; existing zlib-stored
# blobs still decompress unchanged (the codec is recorded per blob in the header).
compression = [
    "zstandard>=0.22",
    "lz4>=4.3",
]

# The REAL browser driver for src/monitoring/ui_walk.py (0.3 gate row 8: the "ui_walk runner
# STANDING" bar). ui_walk.py itself carries NO browser dependency by design -- its control flow
# is proven against a fake driver so it can be tested anywhere; PlaywrightUiWalkDriver
# (src/monitoring/ui_walk_playwright.py) is the build-time decision that scaffold deliberately
# deferred. This extra pins only the Python client library, not a browser -- point
# PLAYWRIGHT_BROWSERS_PATH at a pinned Chromium build (never `playwright install`, which fetches
# one over the network) rather than relying on this extra to provide a browser at all. A core
# install is unaffected; nothing in the app itself imports this module.
uiwalk = [
    "playwright>=1.45",
]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "hypothesis>=6.100",
    # Bounded to one minor series for the same reason mypy is pinned two lines down:
    # scripts/ruff_ratchet.py holds the advisory style lane to a non-growth ceiling,
    # and a count-over-a-tool ratchet is only meaningful while the rule set is fixed.
    # An unbounded floor lets a new release add rules and redden every PR through no
    # code change. Bump deliberately, re-measuring the ceiling in the same PR.
    "ruff>=0.16.6,<0.17",
    # Pinned: the type-check ratchet count must be deterministic. An unpinned
    # floor let a newer mypy report one extra error (129 > 128) and redden every
    # PR with no code change. Bump deliberately, re-measuring the baseline.
    "mypy==2.3.1",
    "httpx>=0.27",
    # Moved from [analysis] 2026-09-08 (audit 10, P2-14) -- see the comment at its old
    # spot above. Used by scripts/analysis/phase4_analyzer.py (circular-import check,
    # degrades honestly without it) and tests/conftest.py's optional-extra probe list.
    "networkx>=3.3",
]

[project.scripts]
open-omniscience = "src.api.main:main"

[project.urls]
Homepage = "https://github.com/ideotion/Open-Omniscience"
Repository = "https://github.com/ideotion/Open-Omniscience.git"
Issues = "https://github.com/ideotion/Open-Omniscience/issues"

# src-layout preserved to keep git history/blame intact. The legacy six-pillar
# trees were archived out of the working tree (docs/QUARANTINE_ARCHIVE.md + the
# quarantine-archive branch); their honest intent was salvaged into src/.
#
# Packaging carries the app's RUNTIME DATA, not just code (RC finding 2026-07-02:
# the built wheel/sdist held ZERO data files, so the published artifacts could not
# serve the UI or seed sources). `src/static` resolves module-relative; `configs/`,
# `migrations/` and the in-app `docs/` resolve as SIBLINGS of the `src` package
# (repo root == site-packages on a wheel install), so they ship as top-level
# namespace packages and the existing path resolution works unchanged. NOTE:
# `src`/`configs`/`docs` are generic top-level names — acceptable for the
# GitHub-release artifact (the primary install path is git + install.sh); a
# PyPI-grade package rename is tracked post-0.1.
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "configs", "migrations*", "docs"]
namespaces = true

[tool.setuptools.package-data]
# static/** is the whole UI. The two data/ trees are runtime data the code READS:
# catalog/data holds the vendored Public Suffix List (newsletter publisher identity),
# geo/data the offline IP->country table. Both modules degrade honestly when the file
# is absent, which is precisely why a packaging omission here would be SILENT.
"src" = ["static/**/*", "catalog/data/*", "geo/data/*"]
"configs" = ["**/*.yml", "**/*.yaml", "**/*.txt", "**/*.json", "**/*.csv", "**/*.mmdb", "**/*.bin", "**/*.gz", "**/*.example"]
"migrations" = ["script.py.mako"]
"docs" = ["*.md", "i18n/**/*.md", "legal/*.md"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations", "build", "dist", ".venv"]

[tool.ruff.lint]
# Sensible, non-pedantic default. E/F = pyflakes+pycodestyle, I = isort,
# UP = pyupgrade, B = bugbear, C4 = comprehensions, SIM = simplify.
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is advisory; ruff-format handles wrapping
    "B008",   # Depends() in arg defaults is the idiomatic FastAPI pattern
    "UP042",  # (str, Enum) is intentional for JSON-serialisable enums
]

# E402 (import-not-at-top) carve-out for the LEGACY HEADER PATTERN only (MAINT-02
# remainder, quality-ratchet session 2026-08-20): these files open with the GPL
# header as one string literal followed by a SECOND bare module-description
# string (plus, in a few, an early setup_logging()/sys.path line the mock
# targets of older tests depend on), so every import after it flags E402 — 164
# findings, a third of the advisory lane, none of them actionable without
# rewriting file headers across the tree. The list is CLOSED and was generated
# from measurement, not intent: it may only SHRINK (merge a file's two header
# strings into one docstring and delete its line here). New files put imports
# at the top and never join it — E402 stays live for the other ~440 files.
[tool.ruff.lint.per-file-ignores]
"src/__init__.py" = ["E402"]
"src/ai_layer/extract.py" = ["E402"]
"src/analysis/confidence_intervals.py" = ["E402"]
"src/analysis/statistical_tests.py" = ["E402"]
"src/api/keyword_analysis.py" = ["E402"]
"src/api/keyword_management.py" = ["E402"]
"src/api/main.py" = ["E402"]
"src/api/source_management.py" = ["E402"]
"src/crypto/__init__.py" = ["E402"]
"src/crypto/merkle_tree.py" = ["E402"]
"src/database/models.py" = ["E402"]
"src/database/source_manager.py" = ["E402"]
"src/ingest/pipeline.py" = ["E402"]
"src/services/__init__.py" = ["E402"]
"src/services/article_intelligence.py" = ["E402"]
"src/services/duckduckgo.py" = ["E402"]
"src/services/keyword_extractor.py" = ["E402"]
"src/services/link_analyzer/extractor.py" = ["E402"]
"src/services/stopwords.py" = ["E402"]
"src/services/text_processor.py" = ["E402"]
"src/utils/__init__.py" = ["E402"]
"src/utils/cache.py" = ["E402"]
"src/utils/compression.py" = ["E402"]
"src/utils/logging_config.py" = ["E402"]
"src/utils/security.py" = ["E402"]
"src/utils/url_utils.py" = ["E402"]
"tests/test_cache.py" = ["E402"]
"tests/test_confidence_intervals.py" = ["E402"]
"tests/test_duckduckgo.py" = ["E402"]
"tests/test_merkle_tree.py" = ["E402"]
"tests/test_security.py" = ["E402"]
"tests/test_source_manager.py" = ["E402"]
"tests/test_statistical_tests.py" = ["E402"]
"tests/test_url_utils.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
# async_db is kept-for-future Postgres scaffolding (unused, 0 coverage) --
# typed properly when it is actually wired in.
exclude = ["migrations/", "src/database/async_db.py"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Only the core suite for now. Pillars are added back as each is rebuilt.
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
