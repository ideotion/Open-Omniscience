# Platform names that COUNT as keywords (R104, the maintainer's answer 6 = a, 2026-09-30):
# a named platform is a real subject of news ("Twitter acquired", "TikTok ban"), unlike the page
# furniture around an article ("comments", "follow", "share"), which goes on the stoplist in
# reviewed batches. scripts/stopword_batch.py REFUSES to add a word listed here, and says so (R111: batches are curated by us; no user is ever asked).
#
# A starting list, extended by review, never a cap. The tool STOPS if this file is missing or lists
# no names: an empty guard would let a platform through silently.
#
# Names that are also ordinary words in some language (signal, threads, x) go in the second list:
# they are refused too, because a wrong ACCEPTANCE hides a platform keyword for every language,
# while a wrong refusal costs one review decision. The maintainer lifts the refusal for one word
# with --allow WORD after reading the evidence (recorded in the batch comment).
platform_names:
  - bluesky
  - discord
  - facebook
  - instagram
  - linkedin
  - mastodon
  - pinterest
  - reddit
  - snapchat
  - telegram
  - tiktok
  - tumblr
  - twitch
  - twitter
  - vkontakte
  - wechat
  - weibo
  - whatsapp
  - youtube

ambiguous_platform_names:
  - signal
  - threads
  - x
