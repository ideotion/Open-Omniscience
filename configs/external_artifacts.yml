# ---------------------------------------------------------------------------- #
# External-artifact registry — the SINGLE SOURCE OF TRUTH for everything this
# project pins, vendors, or bundles from an outside source.
#
# Open Omniscience - Global Intelligence Platform for Investigative Journalism
# Copyright (C) 2026 Ideotion. GPL-3.0-or-later.
#
# WHY THIS EXISTS: dated/pinned external artifacts used to be guarded by scattered,
# per-file `*_AS_OF` constants + per-file freshness tests. That left two gaps: a NEW
# dated thing could ship with no guard, and nothing actively WATCHED UPSTREAM — you
# only learned something moved when it broke. This registry closes both:
#   * src/maintenance/registry.py reads it; tests/test_external_freshness.py enforces
#     it (every `*_AS_OF` constant in the tree MUST be registered here — the protocol
#     guard — and every entry must be within its freshness window + its couplings hold);
#   * scripts/check_external_freshness.py prints a report (the future upstream-watch
#     cron will use it to open an issue when upstream is newer);
#   * GET /api/diagnostics/freshness self-reports staleness from a production install.
#
# WHEN YOU ADD an externally-sourced artifact (a data file, a catalog, a vendored
# binary, a version coupling): ADD AN ENTRY HERE in the same commit. The guard test
# will fail otherwise.
#
# Entry fields:
#   id            unique slug
#   title         human label
#   kind          dated-data | catalog | vendored-data | vendored-binary | runtime-coupling | ci-pin
#   description   what it is / why we bundle it
#   upstream      where it comes from
#   check_upstream how to tell a newer release exists (for the cron + humans)
#   upstream_check  the machine watch: {github, type: release|path_commit, ...}
#                   `current`          the release we SHIP
#                   `reviewed_through` (on-security entries ONLY, test-enforced) the newest
#                     upstream release a human REVIEWED and CLEARED. Kept apart from
#                     `current` because an on-security artifact is SUPPOSED to lag upstream
#                     — we re-vendor on a security fix, not on every release — so comparing
#                     against the shipped version makes the watch fire forever and the
#                     rolling issue never close, which trains everyone to ignore it. Set it
#                     only WITH the evidence of the review in a comment + a fresh
#                     last_verified. It silences nothing permanently: the next release past
#                     it re-flags.
#   license       + attribution requirement when any
#   pin           one of:
#                   {file, const}            a `*_AS_OF` (or version) constant in source
#                   {path, sha256}           a vendored file + its expected digest
#                   {floor, verified}        a dependency floor + the version we verified
#   refresh       the command/steps to refresh it
#   freshness     {max_age_months: N}  |  {policy: on-security|track-duckdb-version|rarely}
#   couplings     ids/notes this must stay consistent with
#   platforms     (vendored-binary only) the per-OS/arch matrix
#   last_verified YYYY-MM-DD + who/how

artifacts:
  # --- dated data / catalogs (each has a *_AS_OF constant the guard checks) -------
  - id: ip-geo-country
    title: DB-IP IP-to-Country Lite
    kind: dated-data
    description: Offline IP->country range table bundled for source-IP geolocation (Slice 6b).
    upstream: https://db-ip.com/db/download/ip-to-country-lite (mirror sapics/ip-location-db, CC BY 4.0)
    check_upstream: "monthly release; mirror dbip-country/ updates ~monthly"
    license: CC BY 4.0 (attribution to DB-IP.com mandatory)
    pin: {file: src/geo/ip_geo.py, const: IP_GEO_AS_OF}
    refresh: "python scripts/build_ip_geo.py --mirror  # then set IP_GEO_AS_OF"
    freshness: {max_age_months: 6}
    couplings: ["src/geo/data/dbip_country_lite.csv.gz must exist + be parseable"]
    upstream_check: {github: "sapics/ip-location-db", type: path_commit, path: "dbip-country/dbip-country-ipv4.csv", compare: as_of}
    # Refreshed 2026-08-22 to the 2026-08 DB-IP release (freshness issue #440). The mirror's
    # last dbip-country data commit is 2026-08-01, which is what fixes the vintage month --
    # the mirror carries no month label of its own, so the release month is read from its
    # commit history, never guessed from today's date. 696,606 -> 706,466 rows; 0 malformed;
    # the country vocabulary is unchanged at 250 codes (none gained, none lost), and v4/v6
    # grew proportionally -- i.e. a routine monthly delta, not a format or coverage change.
    # Verified through the production reader (src.geo.ip_geo.lookup), not just the build
    # script's 5-row check: known IPs resolve (8.8.8.8 us, 1.1.1.1 au, 212.27.48.10 fr,
    # 2001:4860:4860::8888 ca) and the RFC-5737 documentation range still returns the honest
    # level="unavailable" rather than a fabricated country.
    last_verified: "2026-08-22"

  - id: windows-x64-python-nuget
    title: CPython x64 for Windows (NuGet, Python Software Foundation)
    kind: runtime-coupling
    description: >
      install.ps1's last rung for obtaining a win-amd64 interpreter, used when winget
      will not deliver one. NOT vendored and NOT pinned: the version is resolved at
      run time (newest 3.13.x on the flat container) and the bytes are verified
      against the SHA-512 nuget.org ATTESTS for that exact version, read from its
      catalog leaf -- the same shape as the Ollama installer's attested GitHub digest.
      A mismatch refuses; a version with no attested hash refuses. Nothing is written
      down here to go stale, which is the point: a digest embedded in the repo would
      either be fabricated or rot into a false alarm.
      Registered because it is an external SOURCE this project installs software from,
      even though it pins nothing -- the thing worth watching is the package identity
      and the availability of the attestation, not a version.
    upstream: https://www.nuget.org/packages/python
    check_upstream: >
      flat container https://api.nuget.org/v3-flatcontainer/python/index.json lists
      versions; the hash lives at registration5-semver1 -> catalogEntry -> packageHash.
      Watch for: the id changing owner (authors must remain "Python Software
      Foundation"), the tools/python.exe layout changing, or packageHashAlgorithm
      moving off SHA512 -- install.ps1 refuses on the last of those by construction.
    license: PSF-2.0 (CPython; license file ships inside the package)
    pin: {floor: "3.13", verified: "3.13.15"}
    refresh: >
      nothing to refresh -- the version is resolved live. Re-verify the couplings if
      the floor moves off 3.13 (Get-NuGetPythonVersion matches the floor's MAJOR.MINOR
      so a future 3.14 cannot arrive unannounced).
    freshness: {policy: rarely}
    couplings:
      - "install.ps1 MinPython -- Get-NuGetPythonVersion filters to its MAJOR.MINOR"
      - "registration5-semver1, NOT the -gz- endpoint: PS 5.1 cannot decompress gzip"
    last_verified: "2026-08-23"

