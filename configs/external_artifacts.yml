  - id: worldbank-aggregate-codes
    title: World Bank statistical aggregate codes
    kind: catalog
    description: >
      The 78 non-country rows a World Bank `country/all` response contains — "High
      income", "Sub-Saharan Africa", "World" — mapped code -> display name so the
      Governments aggregate view can name them. DISPLAY METADATA ONLY: the guard that
      keeps an aggregate out of country surfaces is structural (countries.to_iso2 admits
      a 2-letter code only when it is a recognised ISO-3166 country), so a stale or
      incomplete table degrades to showing a raw code, never to a fabricated nation.
      That asymmetry is why an entry we are unsure of is OMITTED rather than guessed.
    upstream: https://api.worldbank.org/v2/country?format=json (region.value == "Aggregates")
    check_upstream: >
      Re-read the country list and diff the aggregate rows. VERIFIED 2026-08-07 by a
      networked session: 295 entries, 78 aggregates, 217 economies. That pass found the
      table's own errors were invisible ones — a row for FCS/F1 that does not exist, and
      a MEA rename that moved Afghanistan and Pakistan out of South Asia — so "changes
      rarely" is true of the vocabulary and false of the country SETS behind it. The
      build sandbox still 403s, so re-verification remains a networked task.
    license: CC BY 4.0 (World Bank open data; the table is our metadata)
    pin: {file: src/catalog/aggregates.py, const: WB_AGGREGATES_AS_OF}
    refresh: >
      Fetch the country list on a networked box, take every row whose region.value is
      "Aggregates", and reconcile iso3/iso2/name against the table. Diff the COUNT first
      (78 as of 2026-08-07) — a changed count is the cheapest signal that the vocabulary
      moved. Watch for renames that are really country-set changes: MEA is the worked
      example, and a rename alone would have looked cosmetic. Two names come back with a
      trailing space and are stored trimmed; never key on a name.
    freshness: {max_age_months: 24}
    last_verified: "2026-08-07"

  - id: bloc-membership-registry
    title: Country-group membership (continents, World Bank regions, political blocs)
    kind: catalog
    description: >
      Which countries belong to which group, and WHEN. Membership is time-varying and
      that is the whole point of dating it: BRICS was five members until 2024, NATO
      gained Finland in 2023 and Sweden in 2024, the UK left the EU in 2020 — so a bloc
      figure computed with today's roster over a 1995 series is wrong in a way no reader
      can detect. Continents are populated from the shipped CONTINENT_OF table and carry
      no dates (a country's continent does not change). The political blocs and the World
      Bank regions are deliberately EMPTY: their accession dates are sourced facts, none
      were reachable offline, and ruling 45 forbids guessing a date to make a series
      continuous. Each empty group reports a REASON rather than being absent.
    upstream: >
      Per-bloc: each organisation's own membership page. World Bank regions:
      https://api.worldbank.org/v2/country?format=json (region.value per country).
    check_upstream: >
      Accessions and departures are irregular and individually newsworthy, so there is no
      cadence to poll — re-check when a membership change is reported, and re-read the
      whole roster rather than patching one member, since a departure is easy to miss.
      Note that suspension (several African Union members) is a THIRD state that neither
      joined nor left expresses.
    license: n/a (facts; the dates carry their own source URLs per member)
    pin: {file: src/catalog/blocs.py, const: BLOC_REGISTRY_AS_OF}
    refresh: >
      Run task 4 of docs/design/INTERNET_SESSION_PROMPT_2026-08-07_GOVERNMENTS_DATA.md on
      a networked box. Record joined/left/suspended_from per member WITH the URL each date
      was read from; a member whose accession date cannot be sourced is recorded
      joined=None and surfaces in the payload's `undated_members`, never filled with a
      plausible year. World Bank regions come from the same country list as the aggregate
      codes above, so refresh both together.
    freshness: {max_age_months: 12}
    last_verified: "2026-08-07"

