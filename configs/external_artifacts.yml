  # --- vendored data / binaries (checksum/version, not time) ----------------------
  - id: vendored-alpine
    title: Alpine.js (vendored)
    kind: vendored-binary
    description: Alpine v3.14.1 vendored locally for the GUI gallery (no CDN, sha256-pinned).
    upstream: https://github.com/alpinejs/alpine (npm tarball)
    check_upstream: "watch alpinejs releases for security fixes"
    license: MIT
    # Real measured digest (2026-08-22), cross-checked against the committed sidecar
    # src/static/guis/vendor/alpine.min.js.sha256 — never a fabricated value. A BLANK pin
    # left this entry at status `info` ("present"), i.e. the registry checked that the file
    # exists and never that it was the file we vendored; filled, drift now reports `stale`.
    pin: {path: src/static/guis/vendor/alpine.min.js,
          sha256: "358d9afbb1ab5befa2f48061a30776e5bcd7707f410a606ba985f98bc3b1c034"}
    refresh: "re-vendor the pinned version; update the sha256 + the gallery checksum constant"
    freshness: {policy: on-security}
    # `current` names the version we SHIP (v3.14.1). `reviewed_through` names the newest
    # upstream release reviewed and CLEARED under the on-security policy -- see
    # scripts/check_upstream_updates.py:review_baseline for why the two must stay apart.
    upstream_check:
      {github: "alpinejs/alpine", type: release, current: "v3.14.1",
       reviewed_through: "v3.16.2"}
    # Reviewed 2026-08-22 (freshness issue #440 flagged v3.16.1; upstream had already moved
    # to v3.16.2 by the time it was read -- read the tags, not the issue body). Evidence,
    # from the upstream git history rather than release-note prose:
    #   * 190 commits in v3.14.1..v3.16.2; a keyword scan (secur|vulnerab|xss|cve|ghsa|
    #     sanitiz|escap|inject|exploit|csp|prototype pollut) surfaced 10 candidates.
    #   * Nine are not security fixes: six are CSP-BUILD features (Alpine's eval-free
    #     bundle), plus ShadowRoot support, the addition of SECURITY.md itself, and a
    #     magic-memoization fix that matched only on the word "inject".
    #   * The one genuine XSS-shaped fix is #4770 "Escape attribute values in morph
    #     `setAttribute` patch" (1735d0b, first released v3.15.9) -- it escapes & and "
    #     before an innerHTML attribute write. It lives in packages/morph, and OUR BUNDLE
    #     SHIPS NO MORPH: four token probes over alpine.min.js (morph / Alpine.morph /
    #     hostDiv / monkeyPatchDomSetAttributeToAllowAtSymbols) all return 0.
    #   * Core (packages/alpinejs, 86 commits in range) touched a dangerous sink twice:
    #     89e9685 `x-html` rendering "undefined" (cosmetic) and 76defde "Improve evaluator"
    #     (ADDS a `new Function`; our bundle has none, and an added sink upstream is not a
    #     fix we are missing).
    # So: no security fix applies to what we vendor -> correctly NOT re-vendored.
    # LIMIT, stated rather than glossed: github.com/advisories and api.osv.dev are both
    # egress-blocked from the build sandbox (403), so this is a code-level review of the
    # upstream diff, NOT an advisory-database clearance. A CVE filed against v3.14.1 with
    # no new release would be invisible to this watch.
    last_verified: "2026-08-22"

