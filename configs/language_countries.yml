# Open Omniscience — the elections COVERAGE FLOOR: UI language -> countries.
# Copyright (C) 2026 Ideotion. GPL-3.0-or-later.
#
# WHAT THIS IS. The maintainer ruled (2026-07-14, V1_PATHWAY §4.5) that the elections
# vertical must cover "at least every country whose official or major language is one of
# the twelve UI languages" — if a user can read the app in their language, their country's
# elections must be in it. This file IS that country set: it turns the floor from an
# intention into a denominator the K13 bar can be measured against.
#
# WHY IT IS A DENOMINATOR, AND WHY THAT MAKES BOTH ERRORS EXPENSIVE. A country wrongly
# ABSENT lets the vertical claim coverage it does not have; a country wrongly PRESENT
# manufactures a permanent red the calendar can never clear. So each entry carries the
# BASIS of its claim rather than resting on the list's existence:
#   basis: official  — the language is an official/national language of that state, by
#                      constitution or statute (including co-official).
#   basis: de-facto  — the state names no official language, or names another, but this
#                      language is unambiguously the majority/working language.
#   basis: regional  — official or predominant in a part of the state, not nationally.
#                      COUNTED IN THE FLOOR (the ruling says "official OR major"), but
#                      labelled, because it is the class most likely to be contested.
#
# VERIFICATION STATUS — read this before trusting any row. Drafted 2026-09-07 from the
# assistant's training knowledge, exactly as `configs/climate_events.yml` was, and under
# the same discipline: NOTHING here is presented as verified. The session that wrote it
# had no network (every candidate source host answered 000 through the sandbox proxy while
# pypi.org answered 200), so no row was checked against a primary source. Entries graduate
# to "verified" only after a clearnet check against the per-language `source` below, and
# `scripts/check_external_freshness.py` reports this file's age.
#
# THE KNOWN-CONTESTED ROWS ARE MARKED `contested: true` rather than quietly dropped or
# quietly kept — a language's legal standing is exactly where a confident list is most
# likely to be wrong, and hiding the doubt is worse than carrying it. A reviewer should
# start there.
#
# EXPLICITLY NOT INCLUDED: dependencies and territories that are not ISO 3166-1 officially
# assigned countries (Puerto Rico, Hong Kong, Macau, the French overseas collectivities).
# They hold real elections, but the floor is stated per COUNTRY and the calendar's own
# `country` field is an ISO 3166-1 alpha-2 code. Recorded so their absence reads as a
# scoping decision rather than an oversight.
#
# This is reference data, not an editorial statement about any place — the same disclaimer
# `src/catalog/countries.py` carries about the ISO set it uses.

as_of: "2026-09-07"
verification_status: "drafted-from-training-knowledge; clearnet check pending"
method: >-
  One row per (UI language, country) where the language is official, de-facto national, or
  regionally predominant. The union of the country sets is the elections coverage floor.
  Territories and dependencies are excluded; every code is ISO 3166-1 alpha-2, lowercase,
  and is validated against src/catalog/countries.py at load time.

