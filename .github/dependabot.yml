# Dependabot — the supply-chain half of the external-artifact watch (layer 3).
#
# Open Omniscience - Global Intelligence Platform for Investigative Journalism
# Copyright (C) 2026 Ideotion. GPL-3.0-or-later.
#
# Dependabot covers the artifacts it CAN see automatically: the pip dependencies in
# pyproject.toml and the GitHub Action SHAs in .github/workflows. It opens a PR when a new
# release exists, so those pins never silently drift. The DATA / VENDORED-BINARY / catalog
# artifacts it cannot see (DB-IP geo DB, model catalog, DuckDB crypto extension, …) are
# watched by the freshness cron (.github/workflows/freshness.yml) instead. Together they are
# layer 3 of docs/maintenance/EXTERNAL_DEPENDENCIES.md.
version: 2
updates:
  # Python dependencies (the core + the optional extras, incl. duckdb in [columnar]).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    # A DuckDB bump has a version COUPLING (the per-OS crypto extension + the on-disk
    # store format) — see EXTERNAL_DEPENDENCIES.md; review the checklist before merging.
    ignore:
      # pqcrypto MAJORS only. Dependabot has proposed the identical widening of
      # `pqcrypto>=0.3.4,<1.0` to `<2.0` THREE times (#996 on 2026-09-03, #1012 on
      # 2026-09-07, and once before), and every one of them merged: a bot does not read
      # the reason in the pyproject comment. 1.0.0 renames generate_keypair AND inverts
      # verify(), which returns None for a VALID signature — so signing.py's
      # bool(verify(...)) reports every genuine ML-DSA signature as a forgery, silently,
      # in the tamper-evidence path. The migration goes through
      # docs/maintenance/EXTERNAL_DEPENDENCIES.md, not through a bound widening.
      #
      # THIS IS THE BELT, NOT THE BRACES. tests/test_dependency_ceilings.py is what
      # actually defends the bound — it reddens on any PR that widens the ceiling,
      # naming the inverted predicate — and it keeps working if this stanza is ever
      # deleted or mis-scoped. This only stops the PR being opened a fourth time, so the
      # guard is not the thing anyone has to notice. MINOR and PATCH bumps still come
      # through, so a 0.4.x security release is not muted.
      - dependency-name: "pqcrypto"
        update-types: ["version-update:semver-major"]

  # GitHub Action SHAs (we pin to a SHA + a tag comment; Dependabot bumps the SHA).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["ci", "dependencies"]
    commit-message:
      prefix: "ci"
