# Open Omniscience CI -- the single, working workflow.
# Replaces six legacy workflows that referenced a nonexistent requirements-all.txt,
# targeted Python 3.12, and ran on branches this repo does not use.
name: CI

# Least privilege (audit PR D): this workflow only READS the repo and runs tests.
# The default GITHUB_TOKEN scope is broader than needed once third-party actions and
# `pip install` run on PRs. Grant read-only at the top; add a narrow job-level write
# only if a future job ever needs one.
permissions:
  contents: read

# Don't pile up superseded runs: a rapid push series on the same ref cancels the
# in-flight run and starts fresh (saves runner minutes; the active cycle merges fast).
# EXCEPTION (audit A18-CI-01, 2026-06-18): NEVER cancel the default/release branch's own
# push runs. The fast merge cadence was cancelling every post-merge run before it could
# finish (the branch tip sat `queued`, the prior runs were all `cancelled`), so the
# blocking gates never actually validated the protected branch -- broken tests landed on
# it unseen. Keying the exemption to `repository.default_branch` (not a hardcoded "0.09")
# follows the same don't-rot-on-release-rename principle as the push trigger below; PRs
# and feature-branch pushes still cancel their own superseded runs.
# AND ONE GROUP PER COMMIT ON THE DEFAULT BRANCH (R612, 2026-11-08). cancel-in-progress
# false stops a running main run being cancelled, but a concurrency group still holds only
# ONE pending run: each new merge replaced the queued run of the merge before it, which
# GitHub reports as "cancelled" (#1812, #1818 and #1824 on 2026-11-08, while runners were
# queue-bound). Keying the default branch's group by github.sha gives every merge commit
# its own group, so each one gets its own full run. Every other ref keeps one group per
# ref, so a PR's new push still cancels its superseded run. Pinned by
# tests/test_ci_concurrency.py.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == github.event.repository.default_branch && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

on:
  # Pushes run CI on `main` only; every other branch is covered by its pull
  # request. Running on every pushed branch (the old `branches-ignore: []`) made
  # each PR commit run the whole workflow TWICE -- once as `push`, once as
  # `pull_request` -- for no extra coverage (maintainer pick 2026-09-26, "trim
  # three"). ARCH-01 (direct pushes to the default branch shipping unchecked)
  # stays closed: `main` is still named. The old worry that a named branch rots
  # on each release rename ended when `main` became the permanent default
  # branch (2026-07-15). A branch pushed without a PR gets no CI until one is
  # opened (or run it by hand with workflow_dispatch).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly security cadence (RM-10 / 0.0.8 WP2): a freshly published CVE should
  # surface even in a quiet week, without waiting for a push.
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

jobs:
  # Lightweight weekly job (RM-10): dependency + SAST audit only. Runs ONLY on
  # the schedule; the push/PR lanes get the same gates inside the test job.
  scheduled-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Weekly security audit (bandit + pip-audit)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: SAST (bandit, medium+ severity)
        run: |
          python -m pip install bandit==1.9.4  # pinned: unpinned SAST drift reddens PRs with no code change
          bandit -r src/ -ll -q
      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install pip-audit==2.10.1  # pinned (OO-D15-004): an unpinned audit tool can redden PRs through no code change, exactly like bandit/mypy
          pip-audit --skip-editable

  # ----------------------------------------------------------------------- #
  # DOCS-ONLY FAST PATH (R462). A pull request whose every changed file is documentation (scripts/ci_changed_kind.py: docs/, root Markdown, the two
  # GitHub templates) skips the heavy jobs and runs `docs-checks` instead, about 15 minutes against 100 with backed-up runners. It FAILS OPEN: a push to
  # main, the weekly run, workflow_dispatch, the `ci-full` label (read from the event that started the run: a re-run reuses that event, so add the label and then PUSH; a label alone starts nothing) and any git error all give
  # docs_only=false and the full matrix. The required checks still report: `test` and "Core-only install (no [analysis] extra)" are the aggregators below,
  # green when their legs are, or when docs_only and `docs-checks` are; every other gated job reports "skipped", which branch protection reads as passing.
  # ----------------------------------------------------------------------- #
  changes:
    runs-on: ubuntu-latest
    name: Changed files (docs-only fast path)
    outputs:
      docs_only: ${{ steps.kind.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # a pull request checks out the merge commit: HEAD^1 is the base tip, so the diff below is exactly what the PR changes

      - name: Is this change documentation only?
        id: kind
        env:
          EVENT: ${{ github.event_name }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: |
          verdict="docs_only=false"
          if [ "$EVENT" = "pull_request" ] && [ "$FORCE_FULL" != "true" ]; then
            verdict="$(python3 scripts/ci_changed_kind.py HEAD^1 HEAD || echo docs_only=false)"
          fi
          echo "$verdict" | tee -a "$GITHUB_OUTPUT"

  docs-checks:
    needs: [changes]
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    name: Docs-only checks (fast path)
    timeout-minutes: 75  # the docs tests are most of the suite (the grep below is broad): on a backed-up runner 30 was not enough (#1800)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install (core + analysis + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,dev]"

      - name: Planned-work index — blocked or forbidden paths (BLOCKING)
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" || true
          python scripts/planned.py --diff "origin/${{ github.base_ref }}" --strict

      - name: Ledger fragments (format)
        run: python scripts/ledger_fold.py check

      - name: i18n locale completeness (x12)
        run: python scripts/i18n_report.py --min 100

      # The tests that read documentation: every test file that names docs (as `docs/...` or as a `Path(...) / "docs"` join), CLAUDE.md or the ledger, chosen
      # at run time so a new one needs no edit here. The first pattern here was `docs/` and missed the joined form (twelve files, among them the ones that read
      # docs/USER_MANUAL.md and docs/ETHICS.md; the Opus read of the final head found it), hence the bare word. A named file is not subject to
      # collect_ignore, which is harmless here (the analysis extra is installed above).
      - name: Tests that read the documentation
        run: |
          grep -lE 'docs|CLAUDE\.md|ledger' tests/test_*.py > "$RUNNER_TEMP/docs.args"
          echo "$(wc -l < "$RUNNER_TEMP/docs.args") test files"
          python -m pytest -q -n auto --dist loadfile -rsfE @"$RUNNER_TEMP/docs.args"

      # The wheel carries docs/legal/, docs/i18n/ and docs/USER_MANUAL.md, and scripts/check_wheel_layout.py wants them in it (the `lockfile-install` job's step of the
      # same name): a documentation-only PR that renames or deletes one would otherwise pass here and break the wheel on main.
      - name: Wheel carries the runtime data trees (built as release.yml builds it, read from its own file list)
        run: |
          python -m pip install --upgrade build
          python -m build --outdir "$RUNNER_TEMP/oo-dist"
          python scripts/check_wheel_layout.py "$RUNNER_TEMP"/oo-dist/*.whl

  # THE `test` JOB IS THREE SHARDS (C10, decision 27, R412): it ran the whole suite in one process, 70 to 80 minutes, and the run's wall time was the slower
  # of it and Core-only. Each leg now runs a third of the test FILES, chosen by scripts/ci_shard.py from the measured cost table
  # configs/ci_shard_costs.json (longest file first to the least-loaded shard; a file the table does not name goes to crc32(path) % 3 + 1, so a new test
  # file needs no edit anywhere), and the leg's list is handed to pytest as `@FILE`. The static steps (lint, the planned-work index, the i18n gates, the
  # migration check, mypy, bandit, pip-audit) run in leg 1 only; the table's overhead_seconds is that leg's share.
  #
  # THE REQUIRED CHECK IS NOT A LEG. The check named `test` (branch protection requires it by that name) is the `test-all` job below, which is green only if
  # every leg is. The legs are named "Test (shard N of 3)"; do not name one `test`. tests/test_ci_shards.py pins the pairing, the leg list (1..3, the
  # same N as the table's and as the plan step's) and that nothing but the legs may run the suite under this job's id.
  #
  # NOT AN ISOLATION MODEL: the old single process ran every file in one order, and nothing proved a file did not lean on a neighbour. The one sharded
  # run against an unsharded run of the same commit that settled it is docs/ledger/shipped_log.d/2026-11-05-ci-test-and-core-only-run-in-three-shards.md.
  test:
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    name: Test (shard ${{ matrix.shard }} of 3)
    strategy:
      fail-fast: false  # a red leg must not hide what the other two found
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 75  # R475: a hung job holds a runner slot for the default six hours; the slowest measured run of this job is well under half of this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the tesseract OCR binary (for the [ocr] real round-trip)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      # tests/test_launcher_records_race.py::test_the_filter_records_under_the_one_true_awk needs `original-awk`, and
      # tests/test_launcher_stderr.py::test_the_filter_gives_the_same_record_under_every_awk_it_may_meet needs two of mawk, gawk, original-awk
      # and busybox. With mawk alone both skip (skip-reason audit, 2026-10-29); that the runner image has mawk alone is inferred, so the step
      # prints what was already installed. The default `awk` is put back afterwards: gawk registers itself as the `awk` alternative at
      # priority 10 against mawk's 5, which would move every other launcher test to gawk. The update, the install and the two `command -v`
      # checks are separate lines on purpose: under GitHub's `bash -e` a failing command inside an `&&` chain does not stop the step, so a
      # failed `apt-get update` would leave it green with nothing installed and both tests skipping again without a sound.
      - name: Install two more awk implementations (for the launcher filter tests)
        run: |
          prev="$(readlink -f /usr/bin/awk)"
          echo "already installed: $(command -v original-awk gawk busybox | tr '\n' ' ')(default awk $prev)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq original-awk gawk
          command -v original-awk
          command -v gawk
          sudo update-alternatives --set awk "$prev"
          echo "default awk: $(readlink -f /usr/bin/awk) (was $prev)"

      - name: Install (core + analysis + dev + segmentation + pdf + ocr + geo)
        run: |
          python -m pip install --upgrade pip
          # [segmentation] adds the offline ja/th word segmenters (janome/pythainlp)
          # and sudachipy + its dictionary for the Japanese search index, so the
          # segmentation tests + the ja/th self-test cases run for real here. jieba (zh)
          # is a CORE dependency since 2026-09-25 (Q506 = b, Q1015 = a), so every lane
          # has it; the zh-absent degrade is proven by tests that switch the segmenter
          # off (tests/test_segmentation.py, tests/test_fts_cjk_arabic.py) rather than
          # by an environment, the same shape as pypdf below. [pdf] adds pypdf so the PDF-extraction + PDF-import tests
          # run for real. [ocr] adds pytesseract/pypdfium2/Pillow so the OCR fallback
          # runs for real against the tesseract binary installed above. The Core-only
          # job below (no [segmentation]/[ocr]) proves the graceful-degrade path
          # (segmenter absent -> whitespace tokenizer; OCR unavailable -> a scan stays
          # "no usable text", never a crash).
          #
          # `pdf` LEFT THIS LIST'S CLAIM ON 2026-09-18 (ruling L6): pypdf is a CORE
          # dependency now, so the Core-only job installs it too and no lane has pypdf
          # absent. That is the point of the ruling — 63 of 275 law sources are PDF-only
          # — and it means the pypdf-absent degrade is no longer proven by an ENVIRONMENT.
          # It is proven by a test that patches `pdf_available` instead
          # (tests/test_law_coverage.py, tests/test_pdf_extract.py), which is the stronger
          # shape anyway: it runs in every lane rather than in the one nobody reads.
          # The extra is still named here because it still exists as an alias.
          # [geo] adds pyosmium (0.5 row D, Q808) so the OSM lane's ingest runs through
          # BOTH readers here and their rows are compared; the Core-only job has no [geo],
          # so the pure-Python small-country path is the one it proves.
          python -m pip install -e ".[analysis,dev,segmentation,pdf,ocr,geo]"

      # PySocks, CI-ONLY (audit 10, P2-03): the three
      # tests/test_airplane_socket_guard.py SOCKS-proxy regression tests
      # (`test_socks_proxy_*`) each start with `pytest.importorskip("socks")`, so
      # without this they silently SKIP in every CI lane -- zero red signal if a
      # future refactor reopened the exact Tor/SOCKS bypass those tests exist to
      # keep closed. Installed here, the same way bandit/pip-audit are pinned
      # inline above rather than added to pyproject, deliberately NOT as a
      # pyproject extra: docs/SECURITY.md states plainly that PySocks has "no
      # packaged extra" and end users who want Tor/SOCKS support install it
      # themselves -- that stance is unchanged; this only gives the guard's own
      # regression tests real coverage in CI.
      - name: Install PySocks (for the SOCKS airplane-guard regression tests)
        run: python -m pip install PySocks==1.7.1  # pinned: unpinned CI-only deps redden PRs through no code change

      # BLOCKING correctness lint (audit PR D): F (pyflakes — undefined names,
      # used-before-assignment, unused imports/vars) + B (bugbear — likely bugs).
      # B008 stays ignored (the idiomatic FastAPI `Depends()`-in-defaults pattern,
      # per pyproject `[tool.ruff.lint] ignore`; CLI --select drops config ignores,
      # so we re-apply it). The full style sweep below stays advisory.
      - name: Lint — correctness (ruff F + bugbear, BLOCKING)
        if: matrix.shard == 1
        run: ruff check --select=F,B --extend-ignore=B008 src/ tests/

      - name: Lint — style (ruff, advisory)
        if: matrix.shard == 1
        run: ruff check src/ tests/
        continue-on-error: true  # advisory until the legacy style debt is burned down

      # ...and a NON-GROWTH ratchet on that same lane (ruled 2026-09-07, PROMPT_20 S7
      # "decide whether it converges or stays advisory, and record which"). The verdict
      # is: stays advisory -- see docs/maintenance/RUFF_STYLE_LANE.md for the measured
      # composition and why converging it is not a behaviour-neutral change (I001 alone
      # is 132 findings and reorders imports in a tree with load-bearing import order).
      #
      # What was missing is that "advisory" had quietly become "unwatched": PARKED.md
      # recorded this lane at 344 findings on 2026-08-20 and it measured 432-442 on
      # 2026-09-07, because a lane that is ALLOWED to fail says nothing when it fails a
      # little more. A ratchet, like the two i18n gates below: it may only be LOWERED,
      # and the script prints the new floor when it can drop. ruff is version-bounded in
      # pyproject for the same reason mypy is pinned -- a new rule set would otherwise
      # redden every PR through no code change.
      #
      # CEILING CALIBRATED AT THE MERGE POINT, not when this step was written -- and it
      # moved TWICE while the PR was open, which is itself the measurement that justifies
      # the step. 432 against main @ d9ee33e7; 442 after roughly forty commits from
      # parallel branches; 450 after fifteen more, about forty minutes later. Each time,
      # verified LIKE-FOR-LIKE in a worktree at the exact main being merged that NONE of
      # the growth was this branch's: main alone 450, main-plus-branch 450, and a
      # per-file diff of ruff's JSON showing ZERO files where the branch has more.
      # Shipping the older, tighter number would redden main on the merge commit over
      # findings that are not this PR's, which is worse than a ceiling that reflects the
      # tree it guards. Lowering it is always welcome; the script prints the new floor.
      #
      # A DROP TO 445 WAS SHIPPED HERE AND REVERTED THE SAME DAY (2026-09-11, PR #1115) --
      # recorded because the mistake is instructive and the step's own comment above
      # already warns about its shape. The field-diagnostics batch measured 445 on the
      # COMBINED tree, so 445 was true of the work as a whole. The batch was then split
      # into twelve topic PRs and this branch was rewritten to carry only the brief and
      # the ledger -- so the CODE that removed the finding left this branch, the tree
      # measured 446 again, and the tighter ceiling reddened a docs-only PR over a finding
      # it had no way to fix. CALIBRATE A CEILING AGAINST THE TREE THAT WILL ACTUALLY
      # CARRY IT, not against the tree it was earned on.
      #
      # The drop is not lost, only unclaimed: a ratchet may always be lowered, so whichever
      # topic PR genuinely removes that finding can take 445 with it and prove it on its own
      # tree. Lowering it from here would be asserting a number this branch cannot measure.
      - name: Lint — style non-growth ratchet (may only be lowered)
        if: matrix.shard == 1
        # 2026-09-16 (Q1139, the diagnostics package split): 446 -> 442, MEASURED ON THIS
        # branch, which is the tree that carries it. `origin/main`@a962ea1b reads 445 and
        # this branch reads 441 -- four findings genuinely gone (the split's own modules are
        # import-sorted). This is the drop the note above says a topic PR may claim once it
        # can prove it on its own tree. The ceiling is set at 442 rather than 441 ON PURPOSE,
        # for the same reason as the note above: CI measures the MERGE, so one slot absorbs a
        # finding main lands while this PR is open, and the script prints the new floor to
        # whoever touches the lane next. THE READING TO TRUST IS THE ONE TAKEN AFTER THE LAST
        # EDIT: this branch read 442, then 447, then 443, then 441 as files were added and
        # fixed -- only the base measurement (445) ever said which findings were its own.
        #
        # 2026-10-28: 417 -> 412, MEASURED ON origin/main@3af9f1fc9, the tree that carries it, with
        # the ruff that CI installed from pyproject's range (0.17.3 that day). THE COUNT DEPENDS ON
        # THE TOOL VERSION: the same tree reads 414 on ruff 0.16.9 and 412 on 0.17.3 (the script, run
        # at the old ceiling, said the ceiling can be lowered to 412). pyproject.toml now pins ruff
        # to that one release (ruff==0.17.3, as mypy is pinned), so the number is true by
        # construction and a new release arrives as its own Dependabot PR, whose run re-measures it.
        # There is no spare slot now:
        # CI measures the merge of the PR into the base tip as it stands when the run starts, so a
        # finding another PR lands first reddens the next run of whichever PR merges second (and
        # main's push run, if that PR was already green). Re-measure on the fetched tip, with the
        # ruff CI installs, before merging, never from this comment. (This comment must not spell
        # out the script's command line: guards_for_diff.py refuses a ci.yml with a second such
        # line, and test_ruff_ratchet.py reads the number from the first one.)
        run: python scripts/ruff_ratchet.py --max 412

      # THE PLANNED-WORK REVERSE INDEX (maintainer-asked 2026-09-22): "find a way so that
      # future bug discovery would not contradict what has been planned ... to help future
      # unaware sessions to become aware of the changes, and to avoid redoing some thinking
      # that has already been done."
      #
      # `shipped.csv` answers which files WERE touched. Nothing answered which files a
      # PLANNED decision already owns, and CLAUDE.md names none of the plan files at all --
      # so a session fixing an unrelated bug had nothing pointing at the thirty-eight slice
      # briefs that may already have decided the question it is about to answer for itself.
      # The cost is recorded: LESSONS.md holds a session that trusted a stale code comment
      # and spent one of the maintainer's decisions re-ratifying a setting already ruled.
      #
      # ADVISORY, DELIBERATELY, EXCEPT ON TWO THINGS. The informational half prints and
      # never fails -- a lint that fires on every planned file is one every session learns
      # to pass with --no-verify. `--strict` fails ONLY on a code path a brief forbids or an
      # UNANSWERED ruling names, and an `ACK <id>` line in a commit message clears it: the
      # acknowledgement is not permission, it is the author saying in the permanent record
      # that they read the blocked decision before touching its file.
      - name: Planned-work index (advisory — what is already decided about these files)
        if: github.event_name == 'pull_request' && matrix.shard == 1
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" || true
          python scripts/planned.py --diff "origin/${{ github.base_ref }}"

      - name: Planned-work index — blocked or forbidden paths (BLOCKING)
        if: github.event_name == 'pull_request' && matrix.shard == 1
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" || true
          python scripts/planned.py --diff "origin/${{ github.base_ref }}" --strict

      # Locale-completeness gate (OO-D15-001): the informed-consent mandate ships
      # every chrome/consent/caveat string x12 locales. This was a per-session
      # manual ritual; gate it so a locale that declares status:complete but drops
      # below 100% fails the build (drift can no longer land unblocked). Reads
      # JSON only -- no extra deps.
      - name: i18n locale completeness (x12)
        if: matrix.shard == 1
        run: python scripts/i18n_report.py --min 100

      # The gate above compares the locale files against en.json, so it answers
      # "are the 12 locales mutually consistent?" -- it cannot see a UI string that
      # was never keyed at all. That is how it reported a green 2394/2394 x12 while
      # hundreds of strings rendered English in all 11 non-English locales,
      # .card-caveat text and the additive-restore assurance among them, which the
      # informed-consent mandate above requires to ship x12.
      #
      # A RATCHET, not a target: it may only be lowered. Lower it in the same PR
      # that adds the keys -- the script prints the new floor when it can drop.
      #
      # RE-BASELINED 2026-09-09 (i18n consolidation pass, 2026-09-08 visual audit):
      # 554 -> 575 is NOT a regression -- it is the scanner closing four blind
      # spots it was previously flying with (src/api/main.py's server-rendered
      # article-reader page had zero code-path coverage in any mode; the two aux
      # HTML shells' inline <script> blocks fell between the HTML- and JS-scanners
      # entirely; oosky.js's canvas module was excluded by a file-glob that only
      # matched `app*.js`; and the JS-literal regex family required a `"`/`'`
      # delimiter, missing backtick-quoted literals). None of these 21 net-new
      # strings were introduced by this pass -- they were always there and always
      # untranslated; the count finally says so. See scripts/i18n_report.py's
      # _reader_template_html / _aux_inline_js / _aux_js docstrings for each fix.
      # 470 -> 469: S04-13 S1 keyed the task manager's new per-process budget panel
      # in the same PR that added it, and the script's own "the ratchet can now be
      # lowered" line is an instruction rather than a compliment -- slack left here
      # is a free slot for the next drift to land in unseen.
      # 469 -> 467: S04-02 keyed all 35 of the import lifecycle's new strings in the
      # same PR, and retiring the "Show details" block took one more with it.
      # 464 -> 461: the S04-12 Chromium walk found three Quality-gates strings rendering
      # English in fr and ar. Both ratchets were green over them -- a ratchet answers "did
      # this change make it worse", never "is this surface correct" -- so the walk is what
      # saw them, and the slack they leave behind is lowered in the PR that keys them.
      # 461 -> 0: S04-14 (Q1152 = a) keyed the remainder x12. ZERO IS A DIFFERENT KIND OF
      # NUMBER from the ones above it: every one of those was a debt this gate was
      # tolerating, and there is now none to tolerate. From here the ratchet is a floor
      # rather than a ceiling -- any single new unkeyed string reddens CI on the PR that
      # writes it, which is the state this gate was always aiming at and never reached.
      - name: i18n untranslatable-string ratchet
        if: matrix.shard == 1
        run: python scripts/i18n_report.py --max-untranslatable 0

      # The tight half. The ratchet above counts strings that regexes INFER reach
      # the DOM; this one counts only t("literal") call sites, where the code says
      # so outright -- and t() is an exact map lookup, so every one of these renders
      # verbatim English in all 11 other locales with no ambiguity. Kept separate so
      # the certain class can be driven to zero on its own schedule instead of
      # hiding inside a blended number. Also a ratchet: it may only be lowered.
      #
      # RE-BASELINED 2026-09-09 (same pass as above): 295 -> 314. All 20 net-new
      # sites are t()-wrapped strings inside taskmanager.html's inline <script>
      # (System-tab CPU/memory/disk/network readouts, the "Could not load
      # history." failure state, and the network-toggle hover copy) that were
      # always present and always t()-wrapped, but sat in a file the scanner
      # never opened for JS literals until this pass. Same honest-increase shape
      # as the ratchet above -- the number went up because the instrument can now
      # see the strings, not because new untranslated ones were written.
      #
      # 231 -> 230: S04-02 added twenty t() literals and keyed every one, and the
      # retired "Show details" block took one previously-unkeyed literal with it.
      # 227 -> 224: the same three, plus the scope-count sentence that was welded from
      # four fragments (`t("This will scrape") + n + t("sources") + t("of") + ...`) and is
      # now one keyable tf() frame -- two of its pieces had never had a key.
      # 224 -> 0: S04-14. The last nine were the ones NEITHER number above could reach
      # before: seven literals longer than the audit's 200-character cap, and two shorter
      # than its 3-character floor -- `OK` and `ok`, two characters each, rendering Latin
      # in eleven locales for as long as the app has existed.
      - name: i18n unkeyed t() call sites
        if: matrix.shard == 1
        run: python scripts/i18n_report.py --max-unkeyed-t-calls 0

      # The blind spot the two ratchets above SHARE, found 2026-09-18 (S04-14) by doing
      # the work they exist to drive. Both exclude `{` from every literal they match --
      # deliberately, so a template literal's ${...} never becomes a key nobody can
      # write -- which means the app's OWN interpolation frame, tf("Page {n} of
      # {total}", ...), is invisible to both. That frame is also the FIX for a chain of
      # welded fragments, so converting fragments into a frame lowered both numbers
      # whether or not a key was ever added: the ratchets paid the same for half the
      # work as for all of it. Measured when this step landed: 17 live frames with no
      # en.json key, 7 of them in app-backup.js and shipped long before this slice --
      # import summaries and timings rendering English in all 11 other locales with
      # both ratchets green over them the whole time. Aliases are DISCOVERED from each
      # file's own bindings rather than listed, because the tf name varies (tf, TF,
      # tfa) and _JS_SHAPES already carries the scar of a hand-written alias list.
      # 20 at the moment this step was written, 0 by the end of the same PR: the 17
      # pre-existing frames are keyed and so are the three the PR itself created.
      - name: i18n unkeyed tf() frames
        if: matrix.shard == 1
        run: python scripts/i18n_report.py --max-unkeyed-tf-frames 0

      - name: Migration drift (models vs Alembic baseline)
        if: matrix.shard == 1
        # The CI database is a fresh throwaway file; since at-rest encryption
        # became the default (PR-E), creating a store without a passphrase
        # requires the EXPLICIT plaintext opt-out — which is exactly what this
        # is. Real installs are unaffected (the unlock flow supplies THE
        # passphrase). This step was the silent red on 0.09 since 2026-06-11.
        env:
          OO_DB_PLAINTEXT: "1"
        run: |
          alembic upgrade head
          alembic check

      # WHICH FILES THIS LEG RUNS. scripts/ci_shard.py writes `--ignore=<file>` for every test file that belongs to ANOTHER shard, one per line, to the file the pytest
      # step reads as `@FILE` (pytest >= 8.2), and prints how many of the suite's test files this leg runs, what the cost table predicts for them and how many the table
      # does not name (a table that has fallen behind is read here). It ignores the others' files rather than naming its own because a path named on the command line is
      # NOT subject to `collect_ignore` in tests/conftest.py: the first sharded Core-only leg named its files, collected the two analysis modules a core-only install must
      # not collect and died at import. It refuses a plan that runs nothing or ignores nothing (a shard that ignores everything ends in "no tests ran", red). It is a step of
      # its own so that the pytest step stays the one line tests/test_ci_pytest_flags_and_preflight.py pins, and so that a failure to plan is a red step that names the
      # planner, not a green leg that ran nothing.
      - name: Plan this shard (which test files it runs)
        run: python scripts/ci_shard.py plan --shard ${{ matrix.shard }}/3 --out "$RUNNER_TEMP/shard.args"

      # `-rs` puts every skip's file, line and reason in the pytest summary, so which tests this job did not run is read from its log
      # instead of re-run locally (the 2026-10-29 skip-reason audit had to do exactly that). `-r` REPLACES pytest's default `fE` rather than
      # adding to it, so `-rs` alone would drop the FAILED and ERROR lines from a red run's summary, and the summary is printed in the ORDER
      # of the letters: the flags are `-rsfE`, skips first and the failures LAST, because the last lines of a log are the ones a reader of a
      # red run gets and the skip block runs to hundreds of lines (`-rfEs` put the failures BEFORE it, out of that tail's reach).
      # `--junitxml` writes the report that the skip-summary step below reads: the skips by CLASS and COUNT, a few dozen short lines that fit in any
      # tail, because the `-rs` block above is hundreds of lines (see the step).
      # `-n auto --dist loadfile` (pytest-xdist, pinned in the [dev] extra) runs the leg's files on one worker per CPU of the runner (4 on a public
      # repository's ubuntu-latest), each FILE whole on one worker. tests/conftest.py swaps xdist's first-free-worker order for a FIXED placement
      # (tests/_xdist_placement.py: the cost table dealt longest first, each worker's files in collection order), because two runs in xdist's own
      # order at one commit went red on different order-dependent tests (fixed per commit: a PR that adds a test file re-deals them); tests/conftest.py
      # also gives every worker its own OO_DATA_DIR. Measured
      # 2026-11-08 on 4 cores: each leg's pytest in 6 to 7 minutes against 25 to 31 in one process, which was ~95% of the job; the run's ~200
      # runner-minutes were what kept PRs queued for hours behind each other (#1786: jobs waited 90 to 195 minutes for a runner).
      # The weekly `portability` job keeps running one process per leg, so a test that passes only in parallel order (or only in serial) still shows.
      - name: Test (pytest)
        run: python -m pytest -q -n auto --dist loadfile -rsfE --junitxml="$RUNNER_TEMP/junit.xml" @"$RUNNER_TEMP/shard.args"

      # WHAT WAS INSTALLED WHEN THE SUITE RAN, kept on a red run as well as a green one (`if: always()`), written to the log straight after the
      # suite (the tail of a red run's log) and to the step summary. The install output sits at the HEAD of a long log, which a reader that returns only the last lines never reaches, so
      # two runs that disagree could be compared only through sibling jobs (R349: a green and a red job differed by one pytest minor, released
      # between them). Straight after the suite and BEFORE the steps below install bandit and pip-audit into this same environment, so the list
      # is the test environment and not the audit's. A report only: it pins nothing and changes no result.
      - name: Installed versions (kept on red as well as green)
        if: always()
        run: |
          {
            echo "### Installed versions"
            echo "python $(python -c 'import platform; print(platform.python_version())'), runner image ${ImageOS:-unknown} ${ImageVersion:-unknown}, $(uname -sr)"
            echo '```'
            python -m pip list --format=freeze
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Type check (0.0.8 WP7 / MAINT-03), BLOCKING since 2026-08-20.
      #
      # History, because the number mattered for two years: the Mapped[] ORM
      # migration cut mypy from 303 to 128; fixing two real latent bugs (429
      # handler retry_after, escape(None)) took it to 127; the 2026-08-20 paydown
      # took the remaining 127 to 0 and the ratchet became the plain blocking run
      # this comment had named as the target all along.
      #
      # mypy stays PINNED in pyproject [dev]. That mattered under the ratchet (an
      # unpinned floor once let a newer mypy report 129 > 128 and redden every PR
      # through no code change) and it matters MORE now: at zero, any new
      # diagnostic in a newer release is an immediate red lane. Bump deliberately.
      #
      # If this ever needs to go back to a ratchet, restore the counting form
      # rather than raising a threshold quietly -- a number in this file is a
      # statement about how much debt exists, and it should only ever fall.
      - name: Type check (mypy, BLOCKING)
        if: matrix.shard == 1
        run: python -m mypy src/

      # Blocking security gates (v0.0.7 audit): both are clean today, so any
      # failure is a real regression or a freshly published CVE worth seeing.
      - name: SAST (bandit, medium+ severity)
        if: matrix.shard == 1
        run: |
          python -m pip install bandit==1.9.4  # pinned: unpinned SAST drift reddens PRs with no code change
          bandit -r src/ -ll -q

      - name: Dependency audit (pip-audit)
        if: matrix.shard == 1
        run: |
          python -m pip install pip-audit==2.10.1  # pinned (OO-D15-004): an unpinned audit tool can redden PRs through no code change, exactly like bandit/mypy
          pip-audit --skip-editable

      # THIS LEG'S JUNIT REPORT, kept 14 days, so that the cost table (configs/ci_shard_costs.json) is refreshed from the three reports of any green run
      # (`python scripts/ci_shard.py costs --min-seconds 0.5 junit-test-shard-*/junit.xml`, docs/maintenance/CI_SHARDS.md) and not from the whole suite
      # in one process of 80 minutes (C10 follow-up, R433). The report holds test ids, outcomes and seconds, a traceback for a failure and a skip's
      # reason: what the job log above already prints and nothing the log does not. `if: always()` because a red leg's seconds are as good as a green
      # one's, `continue-on-error` because an upload never turns a job red, `overwrite` because a re-run of a leg writes the same name. It comes BEFORE the
      # skip summary, which has to stay the job's last step (tests/test_ci_pytest_flags_and_preflight.py); tests/test_ci_shards.py pins this step.
      - name: Upload this leg's junit report (the cost table's source)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-test-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 14
          overwrite: true

      # WHAT THIS JOB SKIPPED, by class and by test module, counts only, and its ten SLOWEST test modules in whole seconds (the sum of each module's
      # junit times, not wall time), kept on a red run as well as a green one (`if: always()`), written to the log and to the step summary. The `-rs` block in the pytest step is hundreds of lines and a reader that returns only the last lines of a job log never
      # reaches it, so "what did this job not run" was answered by re-running the suite locally. This is a few dozen short lines (the lists are capped),
      # and an OBSERVATION: it gates nothing (a count that moves is a question for a reader), prints no free-text reason (pytest stores a skip's reason
      # beside an absolute path) and never turns the job red (the script exits 0 whatever it finds, and `continue-on-error` covers the day it crashes).
      # It is the LAST step of the job, after the installed-versions step: the steps between (mypy, bandit, pip-audit) run on a green suite and print
      # more than the log's tail holds, and it is the tail that a reader gets. It must not name the test runner in its command:
      # tests/test_ci_installed_versions_step.py finds "the last test step" by that word, and the installed-versions step has to stay straight after it.
      # tests/test_ci_pytest_flags_and_preflight.py pins the order and the report path.
      - name: Skipped tests and slowest modules (counts and seconds only, no gate)
        if: always()
        continue-on-error: true
        run: python scripts/ci_skip_summary.py "$RUNNER_TEMP/junit.xml" | tee -a "$GITHUB_STEP_SUMMARY"

  # `test-all` IS THE REQUIRED CHECK `test`: green only if all three legs above are. `if: always()` because a job that needs a failed job is SKIPPED otherwise, and a
  # skipped required check reads as passing; `needs.test.result` is `success` only when every leg of the matrix succeeded (a cancelled or skipped leg is not
  # `success`), so a leg that never started fails this job instead of vanishing from it. It installs nothing.
  test-all:
    if: always() && github.event_name != 'schedule'
    needs: [test, changes, docs-checks]
    runs-on: ubuntu-latest
    name: test
    steps:
      - name: All three shards of the test job passed
        env:
          LEGS: ${{ needs.test.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_CHECKS: ${{ needs.docs-checks.result }}
        run: |
          echo "the three shards of the test job: $LEGS (docs-only fast path: $DOCS_ONLY, its checks: $DOCS_CHECKS)"
          test "$LEGS" = "success" || { test "$DOCS_ONLY" = "true" && test "$DOCS_CHECKS" = "success"; }

  # The "extras are optional" contract (audit finding TEST-06): a core-only
  # install must boot and its suite must be green, with analysis-dependent tests
  # skipping cleanly rather than failing.
  #
  # THREE SHARDS, like `test` above (see there): the same planner and cost table, no static steps. The check named "Core-only install (no [analysis] extra)"
  # is the `core-only-all` job below.
  core-only:
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    name: Core-only install, shard ${{ matrix.shard }} of 3 (no [analysis] extra)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 75  # R475: a hung job holds a runner slot for the default six hours; the slowest measured run of this job is well under half of this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install (core + dev only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Boot check
        run: python -c "from src.api.main import app; print(sum(1 for _ in app.routes), 'routes')"

      # `-rsfE`, the same flags as the `test` job's (see there for why `s` comes first): every skip's file, line and reason in the log, so which tests this job did not run is read from it.
      # This job installs core + dev only, so it skips the analysis-module tests on purpose; `-r` REPLACES pytest's default `fE`, so `-rs` alone would drop the FAILED and ERROR lines.
      - name: Plan this shard (which test files it runs)
        run: python scripts/ci_shard.py plan --shard ${{ matrix.shard }}/3 --out "$RUNNER_TEMP/shard.args"

      - name: Test (pytest, analysis modules must skip)
        run: python -m pytest -q -n auto --dist loadfile -rsfE --junitxml="$RUNNER_TEMP/junit.xml" @"$RUNNER_TEMP/shard.args"

      # The same report as the `test` job's (see there): the versions this suite ran against, kept on red as well as green, at the log's tail.
      - name: Installed versions (kept on red as well as green)
        if: always()
        run: |
          {
            echo "### Installed versions"
            echo "python $(python -c 'import platform; print(platform.python_version())'), runner image ${ImageOS:-unknown} ${ImageVersion:-unknown}, $(uname -sr)"
            echo '```'
            python -m pip list --format=freeze
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The same upload as the `test` job's (see there): this leg's junit report, 14 days, the source of the Core-only legs' own times. Before the skip summary.
      - name: Upload this leg's junit report (the cost table's source)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-core-only-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 14
          overwrite: true

      # The same summary as the `test` job's (see there): skip counts by class and by test module, then the ten slowest modules; no free-text reasons, no
      # gate. Here it shows what the analysis-module skips on purpose came to, so a count that moves is a question for a reader. The job's last step, as there.
      - name: Skipped tests and slowest modules (counts and seconds only, no gate)
        if: always()
        continue-on-error: true
        run: python scripts/ci_skip_summary.py "$RUNNER_TEMP/junit.xml" | tee -a "$GITHUB_STEP_SUMMARY"

  # The required check "Core-only install (no [analysis] extra)": green only if all three core-only shards are (see `test-all`).
  core-only-all:
    if: always() && github.event_name != 'schedule'
    needs: [core-only, changes, docs-checks]
    runs-on: ubuntu-latest
    name: Core-only install (no [analysis] extra)
    steps:
      - name: All three shards of the core-only job passed
        env:
          LEGS: ${{ needs.core-only.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_CHECKS: ${{ needs.docs-checks.result }}
        run: |
          echo "the three shards of the core-only job: $LEGS (docs-only fast path: $DOCS_ONLY, its checks: $DOCS_CHECKS)"
          test "$LEGS" = "success" || { test "$DOCS_ONLY" = "true" && test "$DOCS_CHECKS" = "success"; }

  crypto:
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    name: PQC signing path (hybrid Ed25519 + ML-DSA)
    timeout-minutes: 20  # R475: a hung job holds a runner slot for the default six hours; the slowest measured run of this job is well under half of this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Installs the optional [pqc] extra so the post-quantum half of the hybrid
      # signature (custody + signed annotation bundles) is actually exercised, instead
      # of being skipped as it is in the default lane (audit finding F-006).
      #
      # [timestamping] JOINED IT 2026-09-07 with the D7 capability probes. OTS_AVAILABLE
      # is now a round-trip probe rather than an import check, and its POSITIVE half --
      # "a library that IS installed must be reported available" -- could not run in any
      # lane, so a probe that wrongly refused a working install would have shipped
      # unseen. That is not hypothetical: the probe's first run against the real library
      # did exactly that (an empty timestamp cannot be serialized). A guard whose subject
      # is the environment is unreachable unless some lane builds that environment.
      - name: Install (core + analysis + dev + pqc + timestamping)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,dev,pqc,timestamping]"

      # test_dependency_ceilings.py rides THIS lane deliberately. Its first two guards
      # read pyproject and pass anywhere, but the third compares the DECLARED ceiling
      # against the version actually resolved and installed -- and this is the only lane
      # that installs [pqc], so anywhere else it can only skip. Collected by the bare
      # `pytest -q` lanes too; named here so the one environment that can exercise it does.
      - name: Test the hybrid signing + signed annotation bundles
        run: |
          python -m pytest -q \
            tests/test_custody_signing.py \
            tests/test_custody_timestamp.py \
            tests/test_capability_probes.py \
            tests/test_annotations.py \
            tests/test_dependency_ceilings.py

  # ----------------------------------------------------------------------- #
  # Columnar derived store (DuckDB): the [columnar] extra is NOT in the main
  # test lane, so the D2/D3 rollup + D1 loader tests skip there (duckdb absent).
  # This lane installs [columnar] so they run for real (in-memory + fixture
  # verify; the key-derivation tests too, which skip without duckdb and include the
  # real-engine one on DuckDB's software backend), then exercises the D1 persisted-ENCRYPTED round trip under a
  # CI-ONLY trust path: it INSTALLs the real httpfs over the network, checksums
  # it IN-LANE, and NEVER promotes that checksum into external_artifacts.yml
  # (the shipped pins stay blank until the operator's audited build).
  # ----------------------------------------------------------------------- #
  columnar:
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    name: Columnar store (DuckDB rollup + D1 persisted-httpfs)
    timeout-minutes: 30  # R475: a hung job holds a runner slot for the default six hours; the slowest measured run of this job is well under half of this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install (core + analysis + dev + columnar)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,dev,columnar]"

      # 2026-10-28 (R392): the list below grew by the nineteen DuckDB-gated files the rollup work had added since it was
      # written; each skipped in every other job (no other job installs [columnar]) and so had never run in CI. A new
      # file gated on duckdb belongs HERE, or in a job that installs it and runs the whole suite:
      # tests/test_skipped_tests_have_a_ci_job_that_runs_them.py fails for one that no blocking job names.
      # tests/test_external_freshness.py is named for its two DuckDB-dependent tests: the version coupling test, and test_nothing_is_stale,
      # whose registry check compares the installed duckdb with the floor of both track-duckdb-version entries. Without duckdb that
      # branch reports "info", so both pass vacuously. The other thirteen are registry, pin and bundled-data checks that run in the test job too.
      - name: Columnar rollup + D1 loader (in-memory + fixture verify)
        run: |
          python -m pytest -q \
            tests/test_columnar_engine.py tests/test_columnar_readmodel.py \
            tests/test_keyword_daily_rollup.py tests/test_source_coverage_rollup.py \
            tests/test_rollup_serve.py tests/test_columnar_httpfs_loader.py \
            tests/test_rollup_build_streaming.py tests/test_rollup_serve_persisted.py \
            tests/test_columnar_key_derivation.py \
            tests/test_corpus_epoch.py tests/test_keyword_daily_merge_interrupted.py \
            tests/test_keyword_daily_refresh.py tests/test_keyword_daily_refresh_wal_pinning.py \
            tests/test_keyword_daily_scan_bound_race.py tests/test_map_serve.py \
            tests/test_rollup_benchmark.py tests/test_rollup_benchmark_guard.py \
            tests/test_rollup_generation_check.py tests/test_rollup_parity_bound.py \
            tests/test_rollup_persisted_generation.py tests/test_rollup_scan_plan.py \
            tests/test_rollup_shard_checkpoint.py tests/test_rollup_sharded_build.py \
            tests/test_rollup_store_kind.py tests/test_serve_change_gate.py \
            tests/test_serve_out_of_memory_goes_live.py tests/test_top_terms_pre_aggregate.py \
            tests/test_wave7_poll_cache.py tests/test_external_freshness.py

      - name: D1 persisted-encrypted round trip (CI-only httpfs trust path)
        env:
          OO_CI_INSTALL_HTTPFS: "1"
        run: python -m pytest -q tests/test_columnar_httpfs_loader.py -k ci_encrypted_persisted_round_trip

  # ----------------------------------------------------------------------- #
  # The same columnar files on DuckDB 1.x. pyproject says `duckdb>=1.4` with no ceiling, so the job above installs the newest release
  # (2.0.0 on 2026-11-05) and no lane ran the 1.x line that the floor admits: the join-plan assertion in test_top_terms_pre_aggregate reads
  # a profile shape that 1.x and 2.x write differently, and a regression on either side was invisible to the other (R392, R412). This job
  # installs `duckdb<2` (1.5.6 on 2026-11-05) and runs the SAME file list; tests/test_version_floor_legs.py fails if the two lists
  # differ, or if this job stops pinning the 1.x line. No httpfs step: the persisted-encrypted round trip needs the network and stays in
  # the job above. The floor of the registry entry duckdb-crypto-extension stays equal to pyproject's `duckdb>=` (test-enforced).
  # ----------------------------------------------------------------------- #
  columnar-duckdb1:
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    name: Columnar store on DuckDB 1.x
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install (core + analysis + dev + columnar), with DuckDB held to the 1.x line
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,dev,columnar]" "duckdb<2"
          python -c "import sys, duckdb; print('duckdb', duckdb.__version__); sys.exit(0 if duckdb.__version__.startswith('1.') else 1)"

      - name: Columnar rollup + D1 loader on DuckDB 1.x (in-memory + fixture verify)
        run: |
          python -m pytest -q \
            tests/test_columnar_engine.py tests/test_columnar_readmodel.py \
            tests/test_keyword_daily_rollup.py tests/test_source_coverage_rollup.py \
            tests/test_rollup_serve.py tests/test_columnar_httpfs_loader.py \
            tests/test_rollup_build_streaming.py tests/test_rollup_serve_persisted.py \
            tests/test_columnar_key_derivation.py \
            tests/test_corpus_epoch.py tests/test_keyword_daily_merge_interrupted.py \
            tests/test_keyword_daily_refresh.py tests/test_keyword_daily_refresh_wal_pinning.py \
            tests/test_keyword_daily_scan_bound_race.py tests/test_map_serve.py \
            tests/test_rollup_benchmark.py tests/test_rollup_benchmark_guard.py \
            tests/test_rollup_generation_check.py tests/test_rollup_parity_bound.py \
            tests/test_rollup_persisted_generation.py tests/test_rollup_scan_plan.py \
            tests/test_rollup_shard_checkpoint.py tests/test_rollup_sharded_build.py \
            tests/test_rollup_store_kind.py tests/test_serve_change_gate.py \
            tests/test_serve_out_of_memory_goes_live.py tests/test_top_terms_pre_aggregate.py \
            tests/test_wave7_poll_cache.py tests/test_external_freshness.py

  # ----------------------------------------------------------------------- #
  # PORTABILITY (macOS and Windows) RUNS WEEKLY + ON DEMAND, IN THREE SHARDS, NOT PER PUSH (R461, 2026-11-07). Windows came off the per-push path on
  # 2026-09-26 (it hit its 45-minute cap on every run sampled, PRH-29). macOS followed because the cap was ARITHMETIC, not a hang: the job ran the whole
  # suite in ONE process, which Linux needs three shards of 26 to 31 minutes to cover, so on run 42377447182 pytest began 13:43:20 and `timeout-minutes: 45`
  # cancelled it 14:27:42. Every push held a macOS runner for 44 minutes (the scarcest pool) and produced no result. Now each OS runs the same three
  # shards the Linux jobs use (scripts/ci_shard.py, the same cost table, so N stays 3), under a 60-minute cap per leg; the per-push macOS signal that
  # remains is the SQLCipher wheel smoke below (a second). The lane stays an observation: continue-on-error, never required.
  # ----------------------------------------------------------------------- #
  portability:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    name: Portability observation (${{ matrix.os }}, shard ${{ matrix.shard }} of 3)
    continue-on-error: true  # observation lane: graduates to required when green
    # 60 min per leg: a third of the suite is about 28 min on Linux; a macOS or Windows leg that needs more than twice that is a finding, and the cap keeps it
    # from burning six hours (the Windows hang, PRH-29) before anyone reads the log.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash  # one shell on every OS: the Windows default is PowerShell, which does not expand "$RUNNER_TEMP" or read `@FILE` the same way
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install (core + analysis + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,dev]"

      - name: Boot check
        run: python -c "from src.api.main import app; print(sum(1 for _ in app.routes), 'routes')"

      # The file list is written inside the workspace (shard.args), not under $RUNNER_TEMP: on Windows that is a drive-lettered backslash path.
      - name: Plan this shard (which test files it runs)
        run: python scripts/ci_shard.py plan --shard ${{ matrix.shard }}/3 --out shard.args

      # `-rsfE`, the same flags as the `test` job's (see there for why `s` comes first and why `-r` needs `fE` beside it): a macOS skip count that differs from Linux's is read from this log. No junit report here.
      - name: Test (pytest)
        run: python -m pytest -q -rsfE @shard.args

  # SQLCipher driver proof on every OS (gate zero, executed for real): the
  # at-rest encryption batch (PR-E) must not land on wheel inspection alone.
  # BLOCKING by design -- if a wheel breaks on any OS, we must know before
  # the crypto ships, not after.
  sqlcipher-smoke:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: SQLCipher wheel smoke (${{ matrix.os }})
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Encrypt, FTS5, wrong-key and stdlib-unreadable checks
        shell: python
        run: |
          import subprocess, sys
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "sqlcipher3==0.6.4"])
          import os, sqlite3, tempfile
          from sqlcipher3 import dbapi2 as sqc
          path = os.path.join(tempfile.mkdtemp(), "enc.db")
          con = sqc.connect(path)
          con.execute("PRAGMA key = 'smoke-pass'")
          ver = con.execute("PRAGMA cipher_version").fetchone()
          assert ver and "4." in ver[0], f"unexpected cipher_version: {ver}"
          con.execute("CREATE VIRTUAL TABLE ft USING fts5(body)")
          con.execute("INSERT INTO ft VALUES ('the quick brown fox')")
          assert con.execute("SELECT body FROM ft WHERE ft MATCH 'fox'").fetchone()
          con.execute("CREATE TABLE t(x)"); con.execute("INSERT INTO t VALUES (42)")
          con.commit(); con.close()
          with open(path, "rb") as fh:
              assert fh.read(16) != b"SQLite format 3\x00", "file header must be ciphertext"
          con = sqc.connect(path); con.execute("PRAGMA key = 'WRONG'")
          try:
              con.execute("SELECT x FROM t"); raise SystemExit("wrong key read succeeded")
          except sqc.DatabaseError:
              pass
          con.close()
          try:
              sqlite3.connect(path).execute("SELECT * FROM t")
              raise SystemExit("stdlib sqlite3 could read the encrypted file")
          except sqlite3.DatabaseError:
              pass
          print("sqlcipher3 OK on", sys.platform, "| cipher:", ver[0])

  # The damage lane is built on how the bundled SQLCipher REPORTS page damage, and sqlcipher3 is a wheel that
  # carries its own engine (docs/ledger/OPEN_QUEUE.md, the 0.6.4 qualification). Two engines are therefore run
  # against the test files that put real damaged stores through it, so the next release shows up as ONE red lane here and
  # never again as a wholesale red of `test` and Core-only (2026-10-13). The floor is BLOCKING (the oldest engine
  # pyproject still allows); `newest` is the observation lane for the first release NOT yet qualified. Both
  # install the project first and then force the driver with --no-deps, because the pyproject ceiling would
  # refuse the newest release.
  sqlcipher-engines:
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: floor, spec: "sqlcipher3==0.6.2", observe: false}
          - {engine: newest, spec: "sqlcipher3", observe: true}
    runs-on: ubuntu-latest
    name: SQLCipher engine (${{ matrix.engine }})
    continue-on-error: ${{ matrix.observe }}  # observation leg only: an unqualified release must be visible, not block
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install (core + dev), then force the engine under test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --no-deps --upgrade "${{ matrix.spec }}"
          python - <<'PY'
          import importlib.metadata as md
          from sqlcipher3 import dbapi2 as sqc
          con = sqc.connect(":memory:")
          con.execute("PRAGMA key = 'x'")
          print("sqlcipher3", md.version("sqlcipher3"), "| cipher_version", con.execute("PRAGMA cipher_version").fetchone()[0])
          PY

      - name: Test (the files that run a real damaged store through the engine)
        env:
          # The floor leg must STILL see the 4.12 behaviours the floor exists to cover (tests/test_sqlcipher_engine_compat.py).
          OO_EXPECT_SQLCIPHER_ENGINE: ${{ matrix.engine }}
        # `-n auto --dist loadfile`: the ten files on the runner's CPUs, each whole on one worker, in the suite's fixed placement (tests/conftest.py,
        # tests/_xdist_placement.py), as the full-suite legs run since #1816; this step was 7 to 8 of each leg's 8 minutes in one process.
        run: >-
          python -m pytest -q -n auto --dist loadfile
          tests/test_poisoned_connection.py tests/test_database_verify_pages.py tests/test_sqlcipher_engine_compat.py
          tests/test_database_damage.py tests/test_damage_reread.py tests/test_database_verify.py
          tests/test_salvage.py tests/test_repair.py tests/test_bundle_damaged_read.py tests/test_stand_in_rows.py

  # The table of urllib3 log calls (src/ingest/urllib3_log.py) was read from two releases, and the `test` job resolves the newest one the
  # pyproject range admits, so the OLDEST is exercised here: "verified on 2.7.0" is a sentence that nothing else keeps true.
  urllib3-floor:
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    name: urllib3 log table (floor release)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install (core + dev), then force the floor release
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --no-deps "urllib3==2.7.0"
          python -c "import urllib3; print('urllib3', urllib3.__version__)"

      - name: Test (the log-shape table against the floor release)
        run: python -m pytest -q tests/test_urllib3_log_withholds_the_path.py tests/test_external_freshness.py

  # A pinned lock file must INSTALL from a clean environment against public PyPI --
  # not just "the developer's existing venv still works" (audit finding OO-03:
  # numpy==2.5.0 was pinned while unresolvable, and the lock had drifted out of sync
  # with pyproject). A separate `lockfile-resolve` job used to prove the same thing
  # with `--dry-run --require-hashes`; it was dropped 2026-09-26 ("trim three")
  # because the real hash-checked install below fails on exactly the same drift and
  # proves more. This lane runs the REAL two-step
  # sequence that path uses (hash-verified deps, then the project itself editable +
  # --no-deps) in a clean-room venv, exactly as a `./install.sh` run for the
  # requirements.lock's own covered extras would, so a future PR can't regress the
  # wiring without CI catching it.
  lockfile-install:
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    name: Lock file installs clean (requirements.lock, real install)
    timeout-minutes: 30  # R475: a hung job holds a runner slot for the default six hours; the slowest measured run of this job is well under half of this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Real install from requirements.lock (hash-checked)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      # A second, unguarded call: --require-hashes refuses a local/editable
      # requirement outright ("no single file to hash"), so the project itself has
      # to install separately, with --no-deps so it can't silently re-resolve (and
      # drift away from) the pinned set the step above just verified.
      - name: Install the project package itself (editable, no re-resolve)
        run: python -m pip install -e . --no-deps

      - name: Smoke-check the installed package imports
        run: python -c "import src.api.main; print('ok:', src.api.main.__name__)"

      # R318, option A of audit-0.5.0/proposal-mypy-lock-profile-2026-10-27 (adopted by R412). The test job's mypy run sees what
      # `-e ".[analysis,dev,...]"` resolves, the newest release of every unbounded dependency, while an install from this lock gets
      # its pins, and the typing differs between the two: src/api/diagnostics/keywords.py was red on SQLAlchemy 2.0.51 (the lock)
      # and clean on the 2.1 series CI resolved, found a day late on a lock install (#1576). So mypy runs again here, on the
      # lock's own set, and a type error fails this job. This job is not one of the checks branch protection requires (the
      # `test` and Core-only roll-ups are), so making it one is a repository setting, not a line here. The mypy release is the one
      # pyproject's [dev] extra pins, read from pyproject so the two cannot drift apart; the read is its own assignment, so a
      # failed read stops the step under bash -e instead of handing pip an empty name. The lock is then installed again with
      # --no-deps, which puts back any pinned package that mypy's own install moved, and `pip check` refuses a set that no longer
      # fits together (it also checks the project's own requirements against the lock, which no other step does, since the
      # project installs --no-deps). A mypy release that needs a newer typing_extensions than the lock pins reddens `pip check`
      # here: bump the lock with it. Before the wheel step, whose build install would change the set.
      - name: Type check against the lock's own pins (mypy; R318)
        run: |
          pin="$(python -c 'import tomllib; dev = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"]; print(next(r for r in dev if r.startswith("mypy==")))')"
          python -m pip install "$pin"
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
          python -m mypy src/

      # R380 (R353). The wheel is built only by release.yml, at tag time, so a data file the code reads and the wheel does not carry
      # (pyproject lists the data by glob and MANIFEST.in by graft, and a file kind nobody remembered to list simply does not ship) used to
      # be found after the tag. Build it here with the command release.yml runs (python -m build: the sdist first, then the wheel FROM the
      # sdist, so MANIFEST.in decides what the wheel can carry here as it does there) and read the wheel's OWN file list:
      # scripts/check_wheel_layout.py wants every tracked file under src/, configs/, migrations/, docs/legal/ and docs/i18n/ in it (an
      # exempt path is named there with its reason) plus a short list of anchors. It reads a file list: it does not install the wheel or
      # boot the app from it. setuptools is resolved unpinned in the isolated build, as it is at tag time (R381), so a setuptools release
      # that breaks the build reddens this step first; `python -m build` prints "Installed build dependency versions" with the setuptools
      # version just before it builds, so the version sits next to the error, and the checker's last line repeats it as Generator.
      - name: Wheel carries the runtime data trees (built as release.yml builds it, read from its own file list)
        run: |
          python -m pip install --upgrade build
          python -m build --outdir "$RUNNER_TEMP/oo-dist"
          python scripts/check_wheel_layout.py "$RUNNER_TEMP"/oo-dist/*.whl
