# Build the air-gapped dependency bundle.
#
# Manual only: this produces a ~230 MB artifact, so it runs when a human asks for
# it -- after a dependency change, or when preparing a USB stick for an offline
# install. See docs/OFFLINE_INSTALL.md.
#
# WHY ubuntu-22.04 AND NOT ubuntu-latest: pip picks wheels compatible with the
# machine doing the picking, so a bundle built on a newer glibc can contain wheels
# that refuse to install on an older target. 22.04 ships glibc 2.35, which is older
# than Debian 12 (2.36) and Debian 13 (2.41) -- so what this builds installs on
# both. Building on a newer runner would quietly narrow that.

name: Offline bundle

on:
  workflow_dispatch:
    inputs:
      extras:
        description: 'Components to bundle (comma-separated; empty = core only)'
        required: false
        default: 'analysis,compression,columnar'
      publish:
        description: 'Publish the zip to the rolling offline-bundle release'
        type: boolean
        required: false
        default: true
      release_tag:
        description: 'Rolling release tag to publish to (NOT an app version)'
        required: false
        default: 'offline-bundle'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # only so the optional "attach to a release" step can upload
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build the bundle
        run: |
          OO_PYTHON=python3.13 ./scripts/build_offline_bundle.sh \
            --extras "${{ inputs.extras }}" --zip

      - name: Show what was built
        run: |
          # The manifest is the bundle's own description of what it is and what it
          # is for -- surface it in the log so a maintainer can check the target
          # platform without downloading 230 MB first.
          python3 -c "
          import json, glob
          m = json.load(open(glob.glob('dist/*/offline-manifest.json')[0]))
          print('app        :', m['app_version'])
          print('extras     :', m['extras'] or '(core only)')
          print('python     :', m['python']['version'], m['python']['abi_tag'])
          print('platform   :', m['platform'])
          print('files/bytes:', m['totals'])
          "
          ls -lh dist/*.zip

      - name: Verify the bundle installs with no network at all
        run: |
          # The whole promise of this artifact is "installs with no network". Prove
          # it here rather than discovering otherwise on an air-gapped machine:
          # unset every proxy, point pip at a dead index, and install for real.
          set -euo pipefail
          BUNDLE="$(ls -d dist/open-omniscience-offline-*/)"
          python3.13 -m venv --without-pip /tmp/verify
          PIP_WHL="$(ls "$BUNDLE"bootstrap/pip-*.whl | head -1)"
          /tmp/verify/bin/python "$PIP_WHL/pip" install --no-index \
            --find-links "$BUNDLE"bootstrap pip setuptools wheel
          /tmp/verify/bin/python -m pip install --no-index --no-build-isolation \
            --find-links "$BUNDLE"wheels --find-links "$BUNDLE"bootstrap \
            -e ".[${{ inputs.extras }}]"
          /tmp/verify/bin/python -c "
          from src.api.main import app
          print('offline install verified —', len(app.routes), 'routes')
          "
        env:
          # Any accidental network call fails loudly instead of silently succeeding
          # and hiding a package the bundle forgot to carry.
          PIP_NO_INDEX: "1"
          http_proxy: "http://127.0.0.1:9"
          https_proxy: "http://127.0.0.1:9"

      - name: Upload the bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-bundle
          path: dist/*.zip
          retention-days: 14
          compression-level: 0   # already a zip; recompressing buys nothing

      - name: Publish to the rolling offline-bundle release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ZIP="$(ls dist/*.zip)"

          # Notes are BUILT FROM THE MANIFEST, never hand-written: a rolling asset
          # that outlives several app commits has to say which commit it was
          # resolved against, or someone pairs a new app with old dependencies and
          # only finds out when pip refuses a package that did not exist yet.
          python3 - "$ZIP" > notes.md <<'PYEOF'
          import glob, hashlib, json, os, sys

          zip_path = sys.argv[1]
          m = json.load(open(glob.glob("dist/*/offline-manifest.json")[0]))
          digest = hashlib.sha256(open(zip_path, "rb").read()).hexdigest()
          p = m["platform"]

          print(f"""Python dependencies for installing Open Omniscience on a machine with **no
          internet connection**. See [docs/OFFLINE_INSTALL.md](../blob/main/docs/OFFLINE_INSTALL.md).

          This is **not a release of the application** — it is the companion download for the
          air-gapped installer, and the tag is rolling: it is replaced whenever the
          dependencies change, so there is only ever one of it.

          | | |
          |---|---|
          | Built for app version | `{m['app_version']}` |
          | Built from commit | `{os.environ.get('GITHUB_SHA', '')[:12]}` |
          | Built at | {m['built_at']} |
          | Platform | {p['kernel']} / {p['arch']}, glibc {p['glibc']} or newer |
          | Python | {m['python']['version']} ({m['python']['abi_tag']}) |
          | Components | core, {m['extras'] or '(core only)'} |
          | Contents | {m['totals']['files']} files, {m['totals']['bytes'] / 1048576:.0f} MB |
          | `sha256` of the zip | `{digest}` |

          **How to use it:** download the zip below *and* the application
          (Code -> Download ZIP), extract both **side by side** in one folder, then
          double-click *Install Open Omniscience (offline)* inside the application folder.
          The installer verifies every file against the bundle's own checksums before it
          installs anything, and makes no network request.

          **The one rule:** the wheels are compiled for the platform in the table above.
          A different CPU architecture will not work — the installer refuses it by name
          rather than failing halfway. Rebuild with `scripts/build_offline_bundle.sh` on a
          machine matching your target.""")
          PYEOF

          # Create on first run, update in place afterwards -- so this is one click
          # every time, not "create a release, then remember to attach to it".
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md --title "Offline dependency bundle"
            gh release upload "$TAG" "$ZIP" --clobber
          else
            # --prerelease so this auxiliary artifact never takes the "Latest release"
            # badge away from an actual tagged version of the app.
            gh release create "$TAG" "$ZIP" \
              --title "Offline dependency bundle" \
              --notes-file notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          echo "published: $(gh release view "$TAG" --json url --jq .url)"
